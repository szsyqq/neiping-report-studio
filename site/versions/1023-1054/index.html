<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>内评简评报告</title>
<style>
:root{
  --ink:#111418; --ink2:#4b5563; --muted:#9aa1ac; --line:#e6e8eb; --line2:#f1f2f4;
  --bg:#fff; --hover:#f7f8f9; --red:#c0392b; --amber:#9a6700;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.7;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}

header{height:52px;display:flex;align-items:center;gap:14px;padding:0 20px;
  border-bottom:1px solid var(--line);background:#fff}
header .brand{font-size:14px;font-weight:600;letter-spacing:.2px}
header .spacer{flex:1}
header a{color:var(--muted);text-decoration:none;font-size:12.5px;padding:4px 2px}
header a:hover{color:var(--ink)}
header .sep{width:1px;height:14px;background:var(--line)}

.wrap{display:grid;grid-template-columns:318px 1fr;height:calc(100vh - 52px)}
aside{border-right:1px solid var(--line);overflow-y:auto;padding:18px 18px 40px}
main{overflow-y:auto;padding:26px 40px 90px}

.block{padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line2)}
.block:last-child{border-bottom:0}
.block .title{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.4px;margin-bottom:10px}

.field{display:flex;gap:6px}
.field input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:8px 10px;
  background:#fff;outline:none;font-size:13px}
.field input:focus{border-color:#c4c9d1}
.field button{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;
  padding:0 14px;font-size:13px;white-space:nowrap}
.field button:hover{background:#000}
.field button:disabled{background:#c9ccd1;border-color:#c9ccd1;cursor:not-allowed}

/* 流程进度 */
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:7px 0}
.step .dot{width:18px;height:18px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-size:10px;line-height:1;color:var(--muted);margin-top:1px}
.step .label{font-size:13px;display:flex;justify-content:space-between;gap:8px}
.step .pct{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
.step .detail{font-size:11.5px;color:var(--muted);margin-top:3px;word-break:break-all}
.step .bar{height:2px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:6px}
.step .bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .45s ease}
.step.wait .label{color:#c2c7cf}
.step.wait .dot{border-color:#eceef1;color:#cdd2d9}
.step.run .dot{border-color:var(--ink);color:var(--ink)}
.step.done .dot{background:var(--ink);border-color:var(--ink);color:#fff;font-size:11px}
.step.done .label{color:var(--ink2)}
.step.error .dot{border-color:var(--red);color:var(--red)}
.step.error .label{color:var(--red)}
.step.error .detail{color:var(--red)}

/* 材料清单 */
.mat{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line2)}
.mat:last-child{border-bottom:0}
.mat input{margin:2px 0 0;width:14px;height:14px;accent-color:var(--ink);flex:none}
.mat .t{flex:1;min-width:0;font-size:12.5px;line-height:1.55}
.mat .t .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mat .t .meta{color:var(--muted);font-size:11px;margin-top:2px}
.mat .bar{display:block;height:2px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:5px}
.mat .bar i{display:block;height:100%;background:var(--ink);transition:width .4s ease}
.mat.done .meta{color:var(--ink2)}
.mat.error .meta{color:var(--red)}
.mat.wait{opacity:.45}
.btn{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;
  padding:8px 12px;font-size:13px}
.btn:hover{border-color:#c4c9d1;background:var(--hover)}
.btn:disabled{color:#c2c7cf;border-color:var(--line2);background:#fff;cursor:not-allowed}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.primary:disabled{background:#c9ccd1;border-color:#c9ccd1;color:#fff}
select{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:#fff;
  font-size:12.5px;outline:none}

/* 文档区 */
.sheet{max-width:756px;margin:0 auto}
.docbar{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}
.docbar .grow{flex:1;min-width:0}
.docbar .acts{display:flex;gap:8px;align-items:center;white-space:nowrap}
.btn-sm{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;font-size:12.5px}
.btn-sm:hover{border-color:#c4c9d1;background:var(--hover)}
.btn-sm.solid{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-sm.solid:hover{background:#000}
.btn-sm:disabled{color:#c2c7cf;border-color:var(--line2);cursor:not-allowed;background:#fff}

.doc{font-family:"Kaiti SC","KaiTi","STKaiti","Songti SC","SimSun",serif;
  font-size:15.5px;line-height:1.82;color:#1b1f24}
.doc-head{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.doc-head input{border:0;background:transparent;outline:none;font-family:inherit;font-weight:700}
.in-company{flex:1;min-width:0;font-size:16.5px;padding:1px 2px}
.in-code{width:64px;font-size:16.5px;padding:1px 2px;border-bottom:1px solid var(--line)!important;
  text-align:center;font-weight:400!important}
.doc-h{font-weight:700;font-size:15.5px;margin:26px 0 2px}
.doc-h.first{margin-top:22px}
.ta{display:block;width:100%;border:1px solid transparent;border-radius:4px;background:transparent;
  padding:1px 4px;margin:0 -4px;line-height:inherit;font-family:inherit;font-size:inherit;
  resize:none;overflow:hidden;outline:none;color:inherit;text-indent:0}
.ta:hover{border-color:var(--line2);background:#fcfcfd}
.ta:focus{border-color:#cfd4dc;background:#fff}
.ta.lead{font-weight:700}
.items{display:flex;flex-direction:column}
.item{display:flex;gap:2px;align-items:flex-start}
.item .num{white-space:nowrap;padding-top:1px}
.item .ta{flex:1;min-width:0}
.tool{border:0;background:transparent;color:#c2c7cf;font-size:12px;padding:0 3px;line-height:1.9;
  opacity:0;transition:opacity .15s}
.item:hover .tool,.seg:hover .tool,.topic:hover .tool{opacity:1}
.tool:hover{color:var(--red)}
.add{border:0;background:transparent;color:var(--muted);font-size:12px;padding:2px 4px}
.add:hover{color:var(--ink)}
.unit{text-align:right;color:var(--ink2);font-size:13.5px;margin:6px 0 2px}
.doc-table{width:100%;border-collapse:collapse;font-size:13.5px;
  border-top:1.5px solid #111;border-bottom:1.5px solid #111;margin-bottom:4px}
.doc-table th,.doc-table td{padding:3px 8px;border-right:.5px solid #c9ccd1;
  border-bottom:.5px solid #c9ccd1;font-weight:400;text-align:right;vertical-align:middle}
.doc-table th{font-weight:700;text-align:center}
.doc-table th:first-child,.doc-table td:first-child{text-align:left}
.doc-table tr>*:last-child{border-right:0}
.doc-table tbody tr:last-child>*{border-bottom:0}
.seg{margin-bottom:2px}
.seg-head{display:flex;align-items:baseline;gap:2px;line-height:1.6}
.seg-body{margin-top:-3px}
.seg-head .nm{border:0;background:transparent;outline:none;font-family:inherit;font-size:inherit;
  font-weight:inherit;padding:1px 2px;border-bottom:1px dashed transparent;width:auto}
.seg-head .nm:hover{border-bottom-color:var(--line)}
.seg-head .nm:focus{border-bottom-color:#cfd4dc}
.seg-head .suffix{color:var(--ink)}
.topic{margin-bottom:6px}
.notes{margin:14px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:6px;
  background:#fcfcfd;font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px;
  line-height:1.7;color:var(--ink2)}
.notes .h{font-weight:600;color:var(--ink);margin-bottom:4px}
.notes ul{margin:0;padding-left:16px}
.notes li{margin:2px 0}
.notes li.bad{color:var(--red)}
.empty{color:#c2c7cf;font-size:13px;text-align:center;padding:120px 0;
  font-family:-apple-system,"PingFang SC",sans-serif}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);
  background:#111418;color:#fff;font-size:12.5px;padding:8px 16px;border-radius:6px;
  opacity:0;pointer-events:none;transition:.2s;max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
#conn{display:none;padding:8px 20px;font-size:12.5px;color:var(--amber);background:#fffbf0;
  border-bottom:1px solid #f3e6c8}
#conn.show{display:block}
#conn code{background:#f6f0e2;padding:1px 5px;border-radius:3px;font-size:11.5px}
@media(max-width:980px){
  .wrap{grid-template-columns:1fr;height:auto}
  aside{border-right:0;border-bottom:1px solid var(--line)}
  main{padding:20px 18px 80px}
}
</style>
</head>
<body>

<style id="vbar-css">
/* 用文档流而不是 fixed：旧版页面自带 sticky header，fixed 会把它们压住 32px。
   横幅跟着滚走也无妨——用户是从「版本」面板点进来的，本来就知道自己在看旧版。 */
#vbar{position:relative;z-index:9;display:flex;align-items:center;
  gap:10px;padding:0 14px;height:32px;background:#1b1f24;color:#e8ebef;
  font:12px/32px -apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  box-shadow:0 1px 0 rgba(255,255,255,.06);box-sizing:border-box}
#vbar .tag{flex:none;font-weight:600;font-size:11px;letter-spacing:.02em;
  color:#111418;background:#e8ebef;border-radius:3px;padding:1px 6px;line-height:17px}
#vbar .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#c8ced6}
#vbar .tt b{color:#fff;font-weight:600}
#vbar .st{flex:none;color:#8b939d;font-size:11px}
#vbar .st.ok{color:#7fd0a2}
#vbar .st.bad{color:#f0a6a6}
#vbar a{flex:none;color:#cfe2ff;text-decoration:none;font-size:11.5px;
  border:1px solid rgba(255,255,255,.22);border-radius:4px;padding:0 8px;line-height:20px;height:20px}
#vbar a:hover{background:rgba(255,255,255,.10)}
</style>

<div id="vbar">
  <span class="tag">v2 · 10-23 10:54</span>
  <span class="tt"><b>界面重做，四步都有真实进度</b>　白底两栏一纸面；进度不再是装饰，Word 版式照参考件重做。</span>
  <span class="st" id="vstat">正在连接…</span>
  <a href="../">全部版本</a>
  <a href="../../">回到最新版</a>
</div>

<script id="vbar-js">
(function () {
  var stat = document.getElementById("vstat");
  var tok = "";
  try { tok = localStorage.getItem("nrToken") || ""; } catch (e) {}
  try {
    var q = new URLSearchParams(location.search);
    if (q.get("t")) { tok = q.get("t"); localStorage.setItem("nrToken", tok); }
  } catch (e) {}

  function setStat(text, cls) { if (stat) { stat.textContent = text; stat.className = "st " + (cls || ""); } }

  // 旧版页面没有登录概念：补一层请求头，让它们能用当前服务的数据接口。
  if (tok && window.fetch) {
    var raw = window.fetch;
    window.fetch = function (u, o) {
      o = o || {};
      try {
        var h = new Headers(o.headers || {});
        if (!h.has("Authorization")) h.set("Authorization", "Bearer " + tok);
        o.headers = h;
      } catch (e) {}
      return raw.call(window, u, o).then(function (r) {
        if (r.status === 401) setStat("登录已失效", "bad");
        return r;
      });
    };
    var xo = XMLHttpRequest.prototype.open,
        xs = XMLHttpRequest.prototype.send,
        xh = XMLHttpRequest.prototype.setRequestHeader;
    XMLHttpRequest.prototype.open = function () { this.__vbody = 1; return xo.apply(this, arguments); };
    XMLHttpRequest.prototype.setRequestHeader = function (k) {
      if (String(k).toLowerCase() === "authorization") this.__vauth = 1;
      return xh.apply(this, arguments);
    };
    XMLHttpRequest.prototype.send = function () {
      if (!this.__vauth) { try { xh.call(this, "Authorization", "Bearer " + tok); } catch (e) {} }
      return xs.apply(this, arguments);
    };
  }

  // 探活要校验内容：网关爱用 200 + 错误页，只看状态码会误判。
  if (window.fetch) {
    fetch("/api/health", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.ok) throw new Error("bad");
        setStat(tok ? "数据接口已连接" : "已连接，未登录", tok ? "ok" : "");
      })
      .catch(function () { setStat("连不上服务 · 需配合本机或云端服务运行", "bad"); });
  }
})();
</script>

<div id="conn"></div>
<header>
  <div class="brand">内评简评报告</div>
  <div class="spacer"></div>
  <a href="docs/template-v1.1.html" target="_blank">模板</a>
  <span class="sep"></span>
  <a href="docs/method-v1.1.html" target="_blank">方法论</a>
</header>

<div class="wrap">
<aside>
  <div class="block">
    <div class="title">主体</div>
    <div class="field">
      <input id="company" placeholder="企业全称" autocomplete="off" />
      <button id="btnSearch" onclick="doSearch()">检索</button>
    </div>
  </div>

  <div class="block">
    <div class="title">进度</div>
    <div class="steps" id="steps"></div>
  </div>

  <div class="block" id="matBlock" style="display:none">
    <div class="title">材料</div>
    <div id="matList"></div>
    <button class="btn" id="btnFetch" style="margin-top:10px" onclick="doFetch()">拉取选中材料</button>
  </div>

  <div class="block" id="genBlock" style="display:none">
    <div class="title">生成</div>
    <select id="model"></select>
    <button class="btn primary" id="btnGen" style="margin-top:8px" onclick="doGenerate()">生成草稿</button>
  </div>

  <div class="block" id="factBlock" style="display:none;font-size:12px;color:var(--ink2)">
    <div class="title">台账</div>
    <div id="facts"></div>
  </div>
</aside>

<main>
  <div id="empty" class="empty">输入企业全称开始</div>
  <div id="draftArea" style="display:none"></div>
</main>
</div>

<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const S = { company: "", facts: null, items: [], loaded: [], draft: null };

const API_BASE = (() => {
  const h = location.hostname;
  if (h === "127.0.0.1" || h === "localhost" || h === "") return "";
  return (localStorage.getItem("apiBase") || "").replace(/\/+$/, "");
})();
const apiUrl = (p) => API_BASE + p;

const STEPS = [
  { key: "search", label: "检索主体" },
  { key: "materials", label: "拉取材料" },
  { key: "generate", label: "生成草稿" },
  { key: "export", label: "导出报告" },
];
const ST = {};
STEPS.forEach(s => ST[s.key] = { state: "wait", pct: 0, detail: "" });

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function paintSteps(){
  $("#steps").innerHTML = STEPS.map((s,i) => {
    const st = ST[s.key];
    const mark = st.state === "done" ? "✓" : (st.state === "error" ? "!" : (i + 1));
    const bar = st.state === "run"
      ? `<div class="bar"><i style="width:${Math.max(2, st.pct)}%"></i></div>` : "";
    const pct = st.state === "run" ? `<span class="pct">${st.pct}%</span>` : "";
    const det = st.detail ? `<div class="detail">${esc(st.detail)}</div>` : "";
    return `<div class="step ${st.state}">
      <div class="dot">${mark}</div>
      <div><div class="label"><span>${s.label}</span>${pct}</div>${bar}${det}</div>
    </div>`;
  }).join("");
}
function setStep(key, patch){ Object.assign(ST[key], patch); paintSteps(); }
function resetStepsFrom(key){
  const i = STEPS.findIndex(s => s.key === key);
  STEPS.slice(i).forEach(s => ST[s.key] = { state: "wait", pct: 0, detail: "" });
  paintSteps();
}
paintSteps();

let toastTimer = null;
function toast(msg, isErr){
  const el = $("#toast");
  el.textContent = msg;
  el.className = "show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ""; }, isErr ? 8000 : 4000);
}

async function api(path, body){
  const r = await fetch(apiUrl(path), { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok || data.error) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

async function runJob(kind, body, onTick){
  const { job } = await api("/api/jobs/" + kind, body);
  for(;;){
    await sleep(600);
    const r = await fetch(apiUrl("/api/jobs/" + job));
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(j.error || "任务状态读取失败");
    if(onTick) onTick(j);
    if(j.state === "done") return j;
    if(j.state === "error") throw new Error(j.error || "任务失败");
  }
}

async function pingConn(){
  if(!API_BASE) return;
  try{
    const r = await fetch(apiUrl("/api/health"), { mode: "cors" });
    if(!r.ok) throw new Error();
  }catch(e){
    const el = $("#conn");
    el.className = "show";
    el.innerHTML = `未连上本机服务。取数与生成需要本机运行后端：<code>python app/server.py</code>
      <a href="" style="color:inherit;margin-left:8px">改用本机地址打开</a>`;
  }
}

async function loadModels(){
  try{
    const d = await (await fetch(apiUrl("/api/models"))).json();
    $("#model").innerHTML = d.models.map(m =>
      `<option value="${esc(m.id)}" ${m.id === d.default ? "selected" : ""}>${esc(m.name)}</option>`).join("");
  }catch(e){
    $("#model").innerHTML = `<option>未连接服务</option>`;
  }
}

/* ---------------- 检索 ---------------- */
async function doSearch(){
  const company = $("#company").value.trim();
  if(!company) return toast("请输入企业全称", true);
  $("#btnSearch").disabled = true;
  resetStepsFrom("search");
  setStep("search", { state: "run", pct: 0, detail: "连接财汇" });
  try{
    const j = await runJob("search", { company }, j => {
      setStep("search", { state: "run", pct: j.pct, detail: j.detail || j.stage });
    });
    S.company = company;
    S.facts = j.result.facts;
    S.loaded = [];
    S.draft = null;
    setStep("search", { state: "done", pct: 100, detail: "台账已取" });

    renderFacts(S.facts);
    renderMaterials(S.facts);
    const n = (S.facts.materials && Object.values(S.facts.materials).reduce((a, b) => a + b.length, 0)) || 0;
    setStep("materials", { state: "wait", pct: 0, detail: n ? `${n} 份可选` : "未检索到材料" });
    $("#matBlock").style.display = "block";
    $("#genBlock").style.display = "block";
    $("#factBlock").style.display = "block";
    $("#empty").style.display = "block";
    $("#empty").textContent = "勾选材料并拉取后生成草稿";
    $("#draftArea").style.display = "none";
    toast("台账已取：" + (j.result.company || company));
  }catch(e){
    setStep("search", { state: "error", detail: e.message });
    toast(e.message, true);
  }finally{
    $("#btnSearch").disabled = false;
  }
}

function renderFacts(f){
  const ind = (f.company && f.company.indicators) || {};
  const ctrl = (f.equity && f.equity.controller) || {};
  const ratings = f.ratings || [];
  const bonds = f.bonds || [];
  const rows = [
    ["名称", (f.company && f.company.name) || "—"],
    ["实控人", ctrl["实际控制人名称"] || "—"],
    ["持股", ctrl["持股比例（直接+间接）"] || "—"],
    ["注册资本", (ind["注册资本"] || "—") + " 万元"],
    ["行业", ind["所属行业"] || "—"],
    ["城投", ind["是否城投"] || "—"],
  ];
  if(ratings.length){
    const r = ratings[0];
    rows.push(["评级", `${r["评级机构名称"] || ""} ${r["主体评级"] || ""}/${r["评级展望"] || ""}`.trim()]);
  }
  rows.push(["债券", bonds.length ? bonds.length + " 只" : "—"]);
  $("#facts").innerHTML = rows.map(([k, v]) =>
    `<div style="display:flex;gap:8px;padding:2px 0"><span style="color:var(--muted);width:52px;flex:none">${esc(k)}</span>
     <span style="min-width:0;word-break:break-all">${esc(v)}</span></div>`).join("");
}

/* ---------------- 材料 ---------------- */
const MAT_ORDER = ["跟踪评级报告", "募集说明书", "年度报告", "半年报", "季度报告", "审计报告"];
function renderMaterials(f){
  const ms = f.materials || {};
  let html = "";
  for(const k of MAT_ORDER){
    const arr = ms[k] || [];
    if(!arr.length) continue;
    html += `<div style="font-size:11.5px;color:var(--muted);margin:10px 0 2px">${esc(k)}</div>`;
    arr.slice(0, 4).forEach((m, i) => {
      const checked = i === 0 && (k === "跟踪评级报告" || k === "募集说明书" || k === "年度报告");
      html += `<label class="mat">
        <input type="checkbox" class="mchk" data-url="${esc(m.url)}" data-title="${esc(m.title)}" ${checked ? "checked" : ""}/>
        <span class="t"><span class="nm">${esc(m.title)}</span>
        <span class="meta">${esc(m.date || "")}</span></span>
      </label>`;
    });
  }
  $("#matList").innerHTML = html || `<div style="font-size:12px;color:var(--muted)">未检索到可用公告</div>`;
}
function renderMatItems(){
  const ms = S.facts && S.facts.materials || {};
  const flat = [];
  for(const k of MAT_ORDER) (ms[k] || []).slice(0, 4).forEach(m => flat.push(m));
  const byTitle = {};
  S.items.forEach(it => { byTitle[it.title] = it; });
  const nodes = [...document.querySelectorAll("#matList .mat")];
  nodes.forEach(el => {
    const cb = el.querySelector(".mchk");
    const it = byTitle[cb.dataset.title];
    if(!it) return;
    el.classList.toggle("wait", it.state === "wait");
    el.classList.toggle("done", it.state === "done");
    el.classList.toggle("error", it.state === "error");
    let bar = el.querySelector(".bar");
    if(it.state === "run"){
      if(!bar){ bar = document.createElement("span"); bar.className = "bar"; bar.innerHTML = "<i></i>";
        el.querySelector(".t").appendChild(bar); }
      bar.querySelector("i").style.width = it.pct + "%";
    }else if(bar){
      bar.remove();
    }
    el.querySelector(".meta").textContent = it.detail || "";
  });
}

async function doFetch(){
  const picks = [...document.querySelectorAll(".mchk:checked")].map(el => ({ url: el.dataset.url, title: el.dataset.title }));
  if(!picks.length) return toast("请至少勾选一份材料", true);
  $("#btnFetch").disabled = true;
  document.querySelectorAll(".mchk").forEach(c => c.disabled = true);
  S.items = picks.map(p => ({ title: p.title, state: "wait", pct: 0, detail: "等待" }));
  renderMatItems();
  setStep("materials", { state: "run", pct: 0, detail: `0/${picks.length} 份` });
  try{
    const j = await runJob("fetch", { company: S.company, materials: picks }, j => {
      setStep("materials", { state: "run", pct: j.pct, detail: j.detail || "" });
      if(j.items){ S.items = j.items; renderMatItems(); }
    });
    S.loaded = j.result.loaded || [];
    setStep("materials", { state: "done", pct: 100, detail: `${S.loaded.length}/${picks.length} 份已就绪` });
    S.items = j.result.items || S.items;
    renderMatItems();
    setStep("generate", { state: "wait", pct: 0, detail: "" });
    toast("材料已就绪");
  }catch(e){
    setStep("materials", { state: "error", detail: e.message });
    toast(e.message, true);
  }finally{
    $("#btnFetch").disabled = false;
    document.querySelectorAll(".mchk").forEach(c => c.disabled = false);
  }
}

/* ---------------- 生成 ---------------- */
async function doGenerate(){
  if(!S.loaded.length) return toast("请先拉取材料", true);
  $("#btnGen").disabled = true;
  setStep("generate", { state: "run", pct: 0, detail: "准备提示词" });
  try{
    const j = await runJob("generate", { company: S.company, model: $("#model").value }, j => {
      setStep("generate", { state: "run", pct: j.pct, detail: j.detail || j.stage });
    });
    S.draft = j.result.draft;
    setStep("generate", { state: "done", pct: 100, detail: "草稿已生成" });
    setStep("export", { state: "wait", pct: 0, detail: "可编辑后导出" });
    renderDraft();
    toast("草稿已生成，可直接修改");
  }catch(e){
    setStep("generate", { state: "error", detail: e.message });
    toast(e.message, true);
  }finally{
    $("#btnGen").disabled = false;
  }
}

/* ---------------- 草稿 ---------------- */
function ta(cls, val, rows){
  return `<textarea class="ta ${cls}" rows="${rows || 3}">${esc(val || "")}</textarea>`;
}
function segSuffix(name){
  const n = (name || "").trim();
  if(!n) return "业务方面，";
  return /(业务|板块|产品|服务|行业)$/.test(n) ? "方面，" : "业务方面，";
}
function fitSegName(el){
  let w = 0;
  for(const ch of (el.value || "")) w += /[\u2e80-\u9fff\uff00-\uffef]/.test(ch) ? 2 : 1;
  el.style.width = Math.max(2, w + 1) + "ch";
}
function tableHtml(t){
  if(!t || !t.rows) return "";
  const head = t.periods ? ["项目", ...t.periods] : (t.header || []);
  let h = `<div class="unit">${esc(t.unit_line || "单位：亿元")}</div><table class="doc-table"><thead><tr>` +
    head.map(x => `<th>${esc(x)}</th>`).join("") + `</tr></thead><tbody>`;
  for(const r of t.rows) h += `<tr>` + r.map(c => `<td>${esc(c)}</td>`).join("") + `</tr>`;
  return h + `</tbody></table>`;
}

function renderDraft(){
  const d = S.draft, c = d.commentary || {}, v = d.validation || {};
  let h = `<div class="sheet">
    <div class="docbar">
      <div class="grow">
        <div class="doc-head">
          <input class="in-company" id="d-company" value="${esc(d.company_full_name)}" spellcheck="false"/>
          <span style="font-weight:700">主体：【</span>
          <input class="in-code" id="d-code" value="${esc(d.internal_rating_code)}" placeholder="—" spellcheck="false"/>
          <span style="font-weight:700">】</span>
        </div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:2px">
          正文 ${v.body_chars || 0} 字 · 财务表 ${((c.financial_table || {}).rows || []).length} 行
        </div>
      </div>
      <div class="acts">
        <button class="btn-sm" onclick="copyPrompt()">提示词</button>
        <button class="btn-sm solid" id="btnExport" onclick="exportDocx()">导出 Word</button>
      </div>
    </div>`;

  if((v.issues || []).length){
    h += `<div class="notes"><div class="h">待核对 ${v.issues.length} 项</div><ul>` +
      v.issues.map(x => `<li class="${/不足|为空|未找到同值/.test(x) ? "bad" : ""}">${esc(x)}</li>`).join("") +
      `</ul></div>`;
  }

  h += `<div class="doc">
    <div class="doc-h first">正面：</div>
    <div class="items" id="d-pos"></div>
    <button class="add" onclick="addItem('pos')">+ 条目</button>

    <div class="doc-h">关注：</div>
    <div class="items" id="d-con"></div>
    <button class="add" onclick="addItem('con')">+ 条目</button>

    <div class="doc-h">1、基本情况</div>
    ${ta("basic", d.basic_info, 5)}

    <div class="doc-h">2、点评</div>
    ${ta("ov-lead lead", c.overview && c.overview.lead, 2)}
    ${ta("ov-body", c.overview && c.overview.body, 7)}`;

  if(c.segment_table && c.segment_table.rows) h += tableHtml(c.segment_table);

  h += `<div id="d-segs"></div>
    <button class="add" onclick="addSeg()">+ 板块</button>

    <div style="height:12px"></div>
    ${ta("as-lead lead", c.asset && c.asset.lead, 2)}
    ${ta("as-body", c.asset && c.asset.body, 6)}`;

  if(c.financial_table && c.financial_table.rows){
    h += `<div style="text-align:center;font-weight:700;margin:22px 0 0">${esc(c.financial_table.caption || "公司主要财务数据和财务指标（合并口径）")}</div>`;
    h += tableHtml(c.financial_table);
  }

  h += `<div style="height:12px"></div>
    ${ta("db-lead lead", c.debt && c.debt.lead, 2)}
    ${ta("db-body", c.debt && c.debt.body, 7)}
    <div id="d-topics"></div>
    <button class="add" onclick="addTopic()">+ 专题段</button>
  </div></div>`;

  $("#draftArea").innerHTML = h;
  $("#draftArea").style.display = "block";
  $("#empty").style.display = "none";

  renderItems("pos", d.positive || []);
  renderItems("con", d.concern || []);
  renderSegs(c.segments || []);
  renderTopics(c.special_topics || []);
  autoGrowAll();
}

function renderItems(kind, items){
  const box = $("#" + (kind === "pos" ? "d-pos" : "d-con"));
  box.innerHTML = items.map((t, i) => `<div class="item">
    <span class="num">${i + 1}）</span>
    <textarea class="ta it-${kind}" rows="2">${esc(t)}</textarea>
    <button class="tool" onclick="this.parentNode.remove();renumber()">×</button>
  </div>`).join("");
}
function addItem(kind){
  const box = $("#" + (kind === "pos" ? "d-pos" : "d-con"));
  const div = document.createElement("div");
  div.className = "item";
  div.innerHTML = `<span class="num"></span><textarea class="ta it-${kind}" rows="2"></textarea>
    <button class="tool" onclick="this.parentNode.remove();renumber()">×</button>`;
  box.appendChild(div);
  renumber();
  div.querySelector("textarea").focus();
  autoGrow(div.querySelector("textarea"));
}
function renumber(){
  ["#d-pos", "#d-con"].forEach(sel => {
    [...$(sel).querySelectorAll(".item")].forEach((el, i) => {
      el.querySelector(".num").textContent = (i + 1) + "）";
    });
  });
}

function renderSegs(segs){
  $("#d-segs").innerHTML = segs.map(s => `<div class="seg">
    <div class="seg-head">
      <span class="num"></span>
      <input class="nm seg-name" value="${esc(s.name)}" placeholder="板块名" spellcheck="false"
        oninput="fitSegName(this);this.parentNode.querySelector('.suffix').textContent=segSuffix(this.value)"/>
      <span class="suffix">${segSuffix(s.name)}</span>
      <button class="tool" onclick="this.closest('.seg').remove();renumberSegs()">×</button>
    </div>
    <textarea class="ta seg-body" rows="5">${esc(s.body)}</textarea>
  </div>`).join("");
  renumberSegs();
}
function addSeg(){
  const div = document.createElement("div");
  div.className = "seg";
  div.innerHTML = `<div class="seg-head"><span class="num"></span>
    <input class="nm seg-name" placeholder="板块名" spellcheck="false"
      oninput="fitSegName(this);this.parentNode.querySelector('.suffix').textContent=segSuffix(this.value)"/>
    <span class="suffix">业务方面，</span>
    <button class="tool" onclick="this.closest('.seg').remove();renumberSegs()">×</button></div>
    <textarea class="ta seg-body" rows="5"></textarea>`;
  $("#d-segs").appendChild(div);
  renumberSegs();
  div.querySelector(".seg-name").focus();
}
function renumberSegs(){
  [...document.querySelectorAll("#d-segs .seg")].forEach((el, i) => {
    el.querySelector(".num").textContent = (i + 1) + "）";
    fitSegName(el.querySelector(".seg-name"));
  });
}

function renderTopics(ts){
  $("#d-topics").innerHTML = ts.map(t => `<div class="topic">
    <textarea class="ta topic-lead" rows="2">${esc(t.lead)}</textarea>
    <textarea class="ta topic-body" rows="5">${esc(t.body)}</textarea>
    <button class="tool" onclick="this.parentNode.remove()">× 删除本段</button>
  </div>`).join("");
}
function addTopic(){
  const div = document.createElement("div");
  div.className = "topic";
  div.innerHTML = `<textarea class="ta topic-lead" rows="2" placeholder="加粗判断句"></textarea>
    <textarea class="ta topic-body" rows="5" placeholder="正文"></textarea>
    <button class="tool" onclick="this.parentNode.remove()">× 删除本段</button>`;
  $("#d-topics").appendChild(div);
  div.querySelector("textarea").focus();
}

function autoGrow(el){
  el.style.height = "auto";
  el.style.height = (el.scrollHeight + 2) + "px";
}
function autoGrowAll(){ document.querySelectorAll("textarea.ta").forEach(autoGrow); }
document.addEventListener("input", e => {
  if(e.target && e.target.classList && e.target.classList.contains("ta")) autoGrow(e.target);
});

function collectDraft(){
  const d = JSON.parse(JSON.stringify(S.draft));
  d.company_full_name = $("#d-company").value.trim();
  d.internal_rating_code = $("#d-code").value.trim();
  d.positive = [...document.querySelectorAll(".it-pos")].map(t => t.value.trim()).filter(Boolean);
  d.concern = [...document.querySelectorAll(".it-con")].map(t => t.value.trim()).filter(Boolean);
  d.basic_info = $(".ta.basic").value.trim();
  d.commentary.overview = { lead: $(".ta.ov-lead").value.trim(), body: $(".ta.ov-body").value.trim() };
  d.commentary.segments = [...document.querySelectorAll("#d-segs .seg")].map(s => ({
    name: s.querySelector(".seg-name").value.trim(),
    body: s.querySelector(".seg-body").value.trim()
  })).filter(s => s.body);
  d.commentary.asset = { lead: $(".ta.as-lead").value.trim(), body: $(".ta.as-body").value.trim() };
  d.commentary.debt = { lead: $(".ta.db-lead").value.trim(), body: $(".ta.db-body").value.trim() };
  d.commentary.special_topics = [...document.querySelectorAll("#d-topics .topic")].map(t => ({
    lead: t.querySelector(".topic-lead").value.trim(),
    body: t.querySelector(".topic-body").value.trim()
  })).filter(t => t.body);
  return d;
}

async function exportDocx(){
  try{
    const d = collectDraft();
    if(!d.company_full_name) return toast("请填企业全称", true);
    const btn = $("#btnExport");
    btn.disabled = true;
    setStep("export", { state: "run", pct: 60, detail: "排版中" });
    const r = await api("/api/export", { draft: d, company: S.company });
    setStep("export", { state: "done", pct: 100, detail: r.name });
    const a = document.createElement("a");
    a.href = apiUrl(r.url);
    a.download = r.name;
    a.click();
    toast("已导出 " + r.name);
    btn.disabled = false;
  }catch(e){
    setStep("export", { state: "error", detail: e.message });
    toast(e.message, true);
    const btn = $("#btnExport"); if(btn) btn.disabled = false;
  }
}

async function copyPrompt(){
  try{
    const r = await api("/api/prompt", { company: S.company });
    await navigator.clipboard.writeText(`【系统提示】\n${r.system}\n\n【用户提示】\n${r.prompt}`);
    toast("提示词已复制");
  }catch(e){ toast(e.message, true); }
}

loadModels();
pingConn();
$("#company").addEventListener("keydown", e => { if(e.key === "Enter") doSearch(); });
</script>
</body>
