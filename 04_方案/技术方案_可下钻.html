<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内评简评报告自动化 · 技术方案</title>
<style>
:root{
  --bg:#f4f6f8; --card:#ffffff; --ink:#17202a; --ink2:#3d4a58; --ink3:#6b7887;
  --line:#e3e8ed; --brand:#1f3a5f; --brand2:#2c5580; --soft:#eef2f7;
  --warn:#a8621b; --warnbg:#fbf7ef; --ok:#1d6b4c; --okbg:#f0f7f3;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.88;
}
a{color:inherit;text-decoration:none}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:40; height:58px;
  background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:16px; padding:0 26px;
}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand .dot{width:9px;height:9px;background:var(--brand);border-radius:50%;opacity:.85}
.brand b{font-size:14px;font-weight:600;letter-spacing:.2px}
.brand span{font-size:11.5px;color:var(--ink3);letter-spacing:.6px}
.crumb{
  flex:1; min-width:0; display:flex; align-items:center; gap:7px;
  font-size:12.5px; color:var(--ink3); overflow:hidden; white-space:nowrap;
}
.crumb a{color:var(--ink3); border-bottom:1px solid transparent; padding-bottom:1px}
.crumb a:hover{color:var(--brand); border-color:var(--brand)}
.crumb .sep{opacity:.45; font-size:11px}
.crumb .cur{color:var(--brand); font-weight:600}
.levels{display:flex;align-items:center;gap:5px;margin-right:6px}
.levels i{width:7px;height:7px;border-radius:50%;background:#d3dae1;display:block;transition:.25s}
.levels i.on{background:var(--brand);transform:scale(1.15)}
.toc-btn{
  flex-shrink:0; border:1px solid var(--line); background:#fff; color:var(--ink2);
  font-size:12.5px; padding:6px 13px; border-radius:7px; cursor:pointer;
  font-family:inherit; transition:.2s;
}
.toc-btn:hover{border-color:var(--brand); color:var(--brand)}

/* ---------- layout ---------- */
main{max-width:1010px; margin:0 auto; padding:44px 26px 90px}
.page{animation:fade .34s cubic-bezier(.22,.6,.36,1) both}
@keyframes fade{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

.kicker{
  font-size:11.5px; letter-spacing:1.6px; color:var(--brand2); font-weight:600;
  text-transform:uppercase; margin-bottom:12px;
}
h1{
  font-size:clamp(26px,3.2vw,35px); line-height:1.34; margin:0 0 20px;
  font-weight:600; letter-spacing:-.2px; color:#111a24;
}
.lead{
  font-size:17px; line-height:1.86; color:#2f3d4c; margin:0 0 30px;
  padding-bottom:26px; border-bottom:1px solid var(--line);
}
@media (prefers-reduced-motion:reduce){
  .page,.card,#toc,#mask{animation:none!important; transition:none!important}
}

/* ---------- metrics ---------- */
.metrics{
  display:grid; grid-template-columns:repeat(5,1fr); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:10px;
  overflow:hidden; margin:0 0 34px;
}
.metrics div{background:#fff; padding:17px 15px 15px}
.metrics b{
  display:block; font-size:19px; font-weight:600; color:var(--brand);
  font-variant-numeric:tabular-nums; letter-spacing:-.3px; line-height:1.3;
}
.metrics span{display:block; font-size:11.5px; color:var(--ink3); margin-top:5px; line-height:1.5}

/* ---------- prose ---------- */
.prose p{margin:0 0 1.05em; color:var(--ink2)}
.prose p:last-child{margin-bottom:0}
.prose strong{color:#111a24; font-weight:600}

/* ---------- blocks ---------- */
.block{margin:32px 0}
.block-title{
  font-size:12px; font-weight:600; color:var(--ink3); letter-spacing:.8px;
  margin-bottom:11px;
}
table{width:100%; border-collapse:collapse; background:#fff; font-size:13px; line-height:1.65}
table caption{caption-side:top; text-align:left; font-size:12px; color:var(--ink3); padding-bottom:9px}
th,td{padding:10px 13px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top}
th{background:#f2f5f8; font-weight:600; color:#2a3644; font-size:12px; letter-spacing:.3px; white-space:nowrap}
td{font-size:13.5px}
td:first-child{color:#1b2734; font-weight:500; white-space:nowrap; padding-right:18px}
td:nth-child(2){min-width:88px}
table.fixed{table-layout:fixed}
table.fixed td:first-child{white-space:normal}
tr:last-child td{border-bottom:none}
table{border:1px solid var(--line); border-radius:9px; overflow:hidden}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}

ol,ul{margin:0; padding-left:0; list-style:none; counter-reset:n}
ol li,ul li{
  position:relative; padding-left:26px; margin-bottom:11px; color:var(--ink2);
}
ol li{counter-increment:n}
ol li::before{
  content:counter(n); position:absolute; left:0; top:.28em;
  width:17px; height:17px; border-radius:50%; background:var(--soft);
  color:var(--brand); font-size:10.5px; font-weight:600; line-height:17px;
  text-align:center; font-variant-numeric:tabular-nums;
}
ul li::before{
  content:""; position:absolute; left:5px; top:.72em;
  width:5px; height:5px; border-radius:50%; background:#9fb0c2;
}
ol li:last-child,ul li:last-child{margin-bottom:0}
li b{color:#111a24; font-weight:600}

.note{
  background:var(--warnbg); border-left:3px solid #cf9a4d; border-radius:0 8px 8px 0;
  padding:13px 17px; font-size:14px; color:#5a4826; line-height:1.8;
}
.note.ok{background:var(--okbg); border-color:#5da583; color:#22543f}
.note.info{background:var(--soft); border-color:#8fa8c2; color:#2b3f55}
.note b{font-weight:600}

/* ---------- child cards ---------- */
.cards-title{
  font-size:12px; font-weight:600; color:var(--ink3); letter-spacing:.8px;
  margin:46px 0 14px; padding-top:26px; border-top:1px solid var(--line);
}
.cards{display:grid; grid-template-columns:1fr 1fr; gap:13px}
.card{
  display:block; background:#fff; border:1px solid var(--line); border-radius:9px;
  padding:18px 19px 16px; position:relative; transition:.22s cubic-bezier(.2,.6,.35,1);
}
.card:hover{
  border-color:#a9bdd2; transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(31,58,95,.07);
}
.card .idx{
  font-family:var(--mono); font-size:12.5px; font-weight:600; color:var(--brand2);
  letter-spacing:1.5px; display:block; margin-bottom:8px; opacity:.85;
}
.card h3{margin:0 0 6px; font-size:15px; font-weight:600; color:#15202b; letter-spacing:-.1px}
.card p{margin:0; font-size:12.5px; color:var(--ink3); line-height:1.7}
.card .go{
  display:inline-block; margin-top:11px; font-size:11.5px; color:var(--brand);
  opacity:.62; transition:.22s;
}
.card:hover .go{opacity:1; transform:translateX(2px)}

/* ---------- back ---------- */
.back{
  margin-top:38px; padding-top:22px; border-top:1px solid var(--line);
  display:flex; align-items:center; gap:14px;
}
.back a, .back button{
  border:1px solid var(--line); background:#fff; color:var(--ink2);
  font-size:12.5px; padding:7px 15px; border-radius:7px; cursor:pointer;
  font-family:inherit; transition:.2s;
}
.back a:hover, .back button:hover{border-color:var(--brand); color:var(--brand)}
.back .hint{margin-left:auto; font-size:11.5px; color:#9aa6b2}

/* ---------- toc drawer ---------- */
#mask{
  position:fixed; inset:0; background:rgba(23,32,42,.24); opacity:0;
  pointer-events:none; transition:.26s; z-index:50;
}
#mask.on{opacity:1; pointer-events:auto}
#toc{
  position:fixed; top:0; right:0; bottom:0; width:340px; max-width:86vw;
  background:#fff; z-index:51; transform:translateX(100%); transition:.3s cubic-bezier(.3,.7,.4,1);
  display:flex; flex-direction:column; box-shadow:-8px 0 30px rgba(23,32,42,.08);
}
#toc.on{transform:none}
#toc .head{
  padding:19px 22px 15px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between;
}
#toc .head b{font-size:13px; letter-spacing:.3px}
#toc .head button{border:0;background:none;font-size:19px;color:var(--ink3);cursor:pointer;line-height:1;padding:2px 4px}
#toc .body{overflow:auto; padding:12px 0 40px; flex:1}
#toc a{
  display:block; padding:8px 22px; font-size:13px; color:var(--ink2);
  border-left:2px solid transparent; transition:.16s; line-height:1.55;
}
#toc a:hover{background:#f6f8fa; color:var(--brand)}
#toc a.l1{padding-left:36px; font-size:12.5px; color:var(--ink3)}
#toc a.l2{padding-left:50px; font-size:12px; color:#8794a2}
#toc a.on{border-left-color:var(--brand); background:var(--soft); color:var(--brand); font-weight:600}
#toc .grp{font-size:10.5px; letter-spacing:1.2px; color:#9aa6b2; padding:16px 22px 6px}

/* ---------- footer ---------- */
footer{
  max-width:1010px; margin:0 auto; padding:0 26px 60px;
  font-size:11.5px; color:#9aa6b2; line-height:1.9;
}

@media (max-width:820px){
  main{padding:30px 18px 70px}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .cards{grid-template-columns:1fr}
  header{padding:0 16px; gap:10px}
  .brand span{display:none}
  .crumb{font-size:11.5px}
}
@media print{
  body{background:#fff; font-size:11pt}
  header,#toc,#mask,.back,.cards,.cards-title{display:none!important}
  main{max-width:none; padding:0}
  .page{animation:none}
  table{page-break-inside:avoid}
  .lead{border-bottom:none}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="dot"></span>
    <b>内评简评报告自动化</b>
    <span>技术方案 v1.1</span>
  </div>
  <nav class="crumb" id="crumb"></nav>
  <div class="levels" id="levels"><i></i><i></i><i></i></div>
  <button class="toc-btn" onclick="toggleToc(1)">目录</button>
</header>

<main id="view"></main>
<footer id="foot">
  本页为内部技术方案，供评审与决策使用。所述性能数据为本机实测（2026 年 10 月，deepseek-v4-flash）；
  人工工时基线尚未系统测量，建议在试点阶段记录。
</footer>

<div id="mask" onclick="toggleToc(0)"></div>
<aside id="toc">
  <div class="head"><b>内容目录</b><button onclick="toggleToc(0)">×</button></div>
  <div class="body" id="tocBody"></div>
</aside>

<script>
/* ============================================================
   数据：方案内容树。每个节点可含 body（段落）、blocks（表/列表/提示）、
   children（下一层）。level 决定渲染层级标记。
   ============================================================ */
const DATA = {
  id:"root", level:0,
  kicker:"技术方案 · v1.1 · 2026 年 10 月",
  title:"内评简评报告自动化",
  lead:"一份内评简评报告，过去要读三份材料、搭一遍结构、写四千字。现在输入企业全称，取数、装配、校验、排版由系统完成，人只做判断与审稿。全案由三部分组成：一份不依赖行业的模板、一套可复核的写作方法、一个接通财汇数据源的工作台。",
  metrics:[
    {v:"3 份", k:"自动获取材料<br>评级报告 / 募集书 / 年报"},
    {v:"22 项 × 4 期", k:"财务台账"},
    {v:"2,000–4,000 字", k:"正文装配区间"},
    {v:"10 项", k:"装配校验"},
    {v:"约 40 秒", k:"端到端实测"}
  ],
  body:[
    "方案要解决的不是「写不出来」，而是「每次都要重新来一遍」。同一家企业换一个人写，取数口子、期次写法、摘要条数都会变；主体类型一换，财务表的行项也跟着变。这三件事本应是标准件，实际每次都在重做。",
    "所以整套东西按「形式—内容—执行」三层组织：模板管形式，方法论管内容，工作台管执行。三者互为约束，任何一处改动都要同步另两处，避免出现「文档一套、代码一套」——这是同类工具最常见的失效方式。",
    "汇报建议：先看第七章的验证结果，再看第二章的架构取舍；需要核细节时下钻第三、四、六章。每一页都可点击进入，左上角面包屑可逐级回退，右上角目录可直接跳转。"
  ],
  children:[
    {
      id:"why", level:1, idx:"一",
      title:"问题：机械劳动挤占了判断",
      desc:"六步里有四步是重复劳动，且经验不可累积",
      lead:"单份报告的固定动作有六步，其中四步是机械的。瓶颈不在写作能力，而在取数与体例的一致性。",
      body:[
        "六步是：认料、取数、搭结构、写正文、提摘要、排版。这六步里真正需要判断的只有一件事——这家企业值什么评级；其余是翻 PDF 找数、核对口径、确认期次、调格式。人工做一遍，时间主要耗在这些地方，而不是耗在「怎么把话说准」上。",
        "更麻烦的是不可累积。同一个人第二次写会快一些，但经验留在人身上；换人接手，取数口子、期次写法、摘要条数全部重来。三份材料的表述并不统一——同一笔债务，评级报告写「全部债务」，募集书可能写「有息负债」，年报表格又用「短期借款加一年内到期」。",
        "所以问题的定义是：把「取数、结构、体例、排版」这四件机械劳动产品化，让判断留在人的环节。"
      ],
      children:[
        {
          id:"intake-reality", level:2,
          title:"现状：三份材料、四套口径",
          desc:"材料不缺，缺的是对齐",
          lead:"材料不是没有，是散、重、口径不一。取数的真正成本在「对齐」，不在「找到」。",
          body:[
            "三份材料角色不同：跟踪评级报告给结论与风险表述，募集说明书给业务与项目细节（产能、在建、募投），年报给最权威的财务与股权数据。三者时间点经常错位——评级报告可能引用 3 月末数据，年报是 12 月末，募集书更早。",
            "期次错位是最容易出事的地方。把评级报告里「2025 年 1—3 月」的营业收入，配上「2025 年 9 月末」的资产负债率，看起来都像 2025 年，实际拼了两个时点。这类错误人工审稿很难看出来，因为每个数字都真实存在。",
            "单位与口径同理。评级报告用亿元、募集书用万元、年报附注用元；债务口径至少有「短期债务」「有息债务」「全部债务」三种，彼此不等。不先定这三件事，写出来的每个数都要回头核。"
          ],
          blocks:[

          ]
        },
        {
          id:"scope", level:2,
          title:"目标与边界",
          desc:"做四件事，不做三件事",
          lead:"系统做四件事，不做三件事。边界写清楚，才敢用。",
          blocks:[
            {type:"list", title:"做", items:[
              "<b>取数</b>：按企业名检索主体、股权、评级历史、存量债、财务、主营构成",
              "<b>取料</b>：定位并解析最新跟踪评级报告、募集说明书、年报",
              "<b>装配</b>：按模板生成正文、表格、摘要草稿",
              "<b>校验与排版</b>：十项装配检查，导出符合体例的 docx"
            ]},
            {type:"list", title:"不做", kind:"ul", items:[
              "不给评级结论——内部评级代码由人填",
              "不替代现场调研与非公开信息",
              "不保证判断正确——只保证数字有出处、结构合体例"
            ]},
            {type:"note", text:"这三条不是能力不足，是责任边界。评级结论必须有人签字，系统只提供证据与初稿。"}
          ]
        }
      ]
    },
    {
      id:"arch", level:1, idx:"二",
      title:"架构：四层结构，一条主链路",
      desc:"表格数字由程序写，模型只写判断句",
      lead:"全案只有一条主链路，四层各管一件事。核心取舍是——表格数字由程序写，模型只写判断句。",
      body:[
        "这样切的原因很直接：模型的强项和弱项分得很清楚。它能把散落的材料组织成有因果的段落，但让它同时管「数字准确」和「表述得体」，两头都不稳。把数字从模型手里拿走、交给确定性代码，剩下的语言任务它就做得住。",
        "四层之间用 JSON 传递：数据层产出「事实台账」，生成层产出「草稿 JSON」，质检层在草稿上打问题清单，排版层只认草稿结构、不认模型输出。任何一层都可以单独替换，换模型、换数据源都不用动其他层。"
      ],
      children:[
        {
          id:"layers", level:2,
          title:"四层与职责",
          desc:"每层的输入、输出与代码位置",
          lead:"分工的唯一标准是「谁对准确性负责」：数字归数据层，规则归资产层，语言归生成层。",
          blocks:[
            {type:"table", caption:"表 2-1　分层与职责", head:["层","职责","实现","输出"], rows:[
              ["数据层","主体检索、财务台账、公告与 PDF","mcp_client.py / facts.py / pdf_text.py","事实台账 JSON"],
              ["资产层","体例、槽位、指标规则、写作方法","模板 v1.1.json + 方法论 v1.1.md","可执行规则"],
              ["生成层","提示词装配、单次调用、结构补全","generator.py / llm.py","草稿 JSON"],
              ["质检层","四类校验、问题清单","generator.validate","issues 列表"],
              ["交付层","docx 装配与版式","docx_writer.py",".docx"]
            ]}
          ],
          body:[
            "数据层的输出叫「事实台账」，不是原始数据堆。里面已经做完单位换算（万元→亿元）、期次标注（2025 年年报 / 2026 年中报）、口径标记（有息债务 / 全部债务），并附一张「期次写法」对照表，告诉下游每一期该怎么写。",
            "资产层是唯一允许人直接改的地方。模板是 json、方法论是 md，改完不用动代码——除非要新增一种触发条件的解释逻辑，那才需要改 generator.py 里的判断函数。"
          ]
        },
        {
          id:"pipeline", level:2,
          title:"一次生成的完整链路",
          desc:"九步，实测约 40 秒",

          blocks:[
            {type:"table", caption:"表 2-2　链路与实测耗时（无锡苏南国际机场，本机环境）", head:["步骤","动作","耗时"], rows:[
              ["1 主体识别","工商信息、实控人、股东、评级历史、存量债","与下一步合计 14.5 秒"],

/* ============================================================
   路由与渲染
   ============================================================ */
const view = document.getElementById("view");
const crumbEl = document.getElementById("crumb");
const levelsEl = document.getElementById("levels");
const NODE_INDEX = new Map();

(function index(node, path){
  const p = path.concat([node]);
  NODE_INDEX.set(node.id, {node, path: p});
  (node.children || []).forEach(c => index(c, p));
})(DATA, []);

function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function blocksHtml(blocks){
  if (!blocks) return "";
  // 只有纯数值（含百分比、倍数、--）右对齐；含中文的说明性文字一律左对齐，
  // 否则长句会因右对齐而在行内错位。
  const looksNum = s => {
    const t = String(s == null ? "" : s).trim();
    return t === "--" || /^[¥￥]?[\d,]+(\.\d+)?%?$/.test(t) || /^\d+(\.\d+)?(倍|%)$/.test(t);
  };
  return blocks.map(b => {
    if (b.type === "table"){
      const head = (b.head || []).map(h => `<th>${esc(h)}</th>`).join("");
      const rows = (b.rows || []).map(r => "<tr>" + r.map((c, i) =>
        (i === 0 || !looksNum(c)) ? `<td>${esc(c)}</td>` : `<td class="num">${esc(c)}</td>`
      ).join("") + "</tr>").join("");
      const colgroup = b.colw
        ? "<colgroup>" + b.colw.map(w => `<col style="width:${w}">`).join("") + "</colgroup>"
        : "";
      return `<div class="block"><div class="block-title">${esc(b.caption || "")}</div>
        <table${b.colw ? ' class="fixed"' : ""}>${colgroup}<thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
    }
    if (b.type === "list"){
      const tag = b.kind === "ul" ? "ul" : "ol";
      const items = (b.items || []).map(x => `<li>${x}</li>`).join("");
      return `<div class="block">${b.title ? `<div class="block-title">${esc(b.title)}</div>` : ""}
        <${tag}>${items}</${tag}></div>`;
    }
    if (b.type === "note"){
      const tone = b.tone ? " " + b.tone : "";
      return `<div class="block"><div class="note${tone}">${b.text}</div></div>`;
    }
    return "";
  }).join("");
}

function metricsHtml(m){
  if (!m) return "";
  return `<div class="metrics">${m.map(x =>
    `<div><b>${esc(x.v)}</b><span>${x.k}</span></div>`).join("")}</div>`;  // k 允许写 <br>
}

function cardsHtml(children, level){
  if (!children || !children.length) return "";
  const cards = children.map((c, i) => {
    const tag = String(i + 1).padStart(2, "0");
    return `<a class="card" href="#/${c.id}">
      <span class="idx">${tag}</span>
      <h3>${esc(c.title)}</h3>
      <p>${esc(c.desc || "")}</p>
      <span class="go">进入 →</span>
    </a>`;
  }).join("");
  return `<div class="cards-title">${level === 0 ? "分章阅读" : "本节下钻"}</div>
    <div class="cards">${cards}</div>`;
}

function backHtml(entry){
  const parent = entry.path.length > 1 ? entry.path[entry.path.length - 2] : null;
  const btn = parent
    ? `<a href="#/${parent.id}">← 返回：${esc(parent.title)}</a>`
    : `<a href="#/">← 回到首页</a>`;
  return `<div class="back">${btn}
    <button onclick="toggleToc(1)">打开目录</button>
    <button onclick="window.print()">打印本页</button>
    <span class="hint">按 Esc 返回上级</span></div>`;
}

function render(id){
  const entry = NODE_INDEX.get(id) || NODE_INDEX.get("root");
  const {node, path} = entry;

  // 面包屑
  crumbEl.innerHTML = path.map((n, i) => {
    const last = i === path.length - 1;
    const label = i === 0 ? "总览" : n.title;
    return (i ? '<span class="sep">/</span>' : "") +
      (last ? `<span class="cur">${esc(label)}</span>` : `<a href="#/${n.id}">${esc(label)}</a>`);
  }).join("");

  // 层级指示
  [...levelsEl.children].forEach((el, i) => el.classList.toggle("on", i === node.level));

  const bodyHtml = (node.body || []).map(p => `<p>${p}</p>`).join("");
  view.innerHTML = `<article class="page">
    <div class="kicker">${esc(node.kicker || "")}</div>
    <h1>${esc(node.title)}</h1>
    <p class="lead">${esc(node.lead || "")}</p>
    ${metricsHtml(node.metrics)}
    ${bodyHtml ? `<div class="prose">${bodyHtml}</div>` : ""}
    ${blocksHtml(node.blocks)}
    ${cardsHtml(node.children, node.level)}
    ${backHtml(entry)}
  </article>`;

  document.getElementById("foot").style.display = node.level === 0 ? "" : "none";
  document.title = (node.id === "root" ? "" : node.title + " · ") + "内评简评报告自动化";
  window.scrollTo(0, 0);
  markToc(id);
}

/* ---------- 目录 ---------- */
function buildToc(){
  let html = `<a href="#/" data-id="root">总览</a>`;
  (DATA.children || []).forEach(c => {
    html += `<a href="#/${c.id}" data-id="${c.id}">${esc(c.idx)}、${esc(c.title)}</a>`;
    (c.children || []).forEach(g => {
      html += `<a href="#/${g.id}" data-id="${g.id}" class="l1">${esc(g.title)}</a>`;
      (g.children || []).forEach(h => {
        html += `<a href="#/${h.id}" data-id="${h.id}" class="l2">${esc(h.title)}</a>`;
      });
    });
  });
  document.getElementById("tocBody").innerHTML = html;
}
function markToc(id){
  document.querySelectorAll("#tocBody a").forEach(a =>
    a.classList.toggle("on", a.dataset.id === id));
}
function toggleToc(on){
  document.getElementById("toc").classList.toggle("on", !!on);
  document.getElementById("mask").classList.toggle("on", !!on);
}

/* ---------- 路由 ---------- */
function route(){
  const m = location.hash.match(/^#\/(.+)$/);
  render(m ? decodeURIComponent(m[1]) : "root");
  toggleToc(0);
}
window.addEventListener("hashchange", route);
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){
    const tocOpen = document.getElementById("toc").classList.contains("on");
    if (tocOpen){ toggleToc(0); return; }
    const m = location.hash.match(/^#\/(.+)$/);
    if (m){
      const entry = NODE_INDEX.get(decodeURIComponent(m[1]));
      const parent = entry && entry.path.length > 1 ? entry.path[entry.path.length - 2] : null;
      location.hash = parent ? "#/" + parent.id : "#/";
    }
  }
});

buildToc();
route();
</script>
