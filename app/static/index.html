<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>内评简评报告</title>
<style>
:root{
  --ink:#111418; --ink2:#4b5563; --muted:#9aa1ac; --line:#e6e8eb; --line2:#f1f2f4;
  --bg:#fff; --hover:#f7f8f9; --red:#c0392b; --amber:#9a6700;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.7;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}

header{height:52px;display:flex;align-items:center;gap:14px;padding:0 20px;
  border-bottom:1px solid var(--line);background:#fff}
header .brand{font-size:14px;font-weight:600;letter-spacing:.2px}
header .spacer{flex:1}
header a{color:var(--muted);text-decoration:none;font-size:12.5px;padding:4px 2px}
header a:hover{color:var(--ink)}
header .sep{width:1px;height:14px;background:var(--line)}

/* 用量统计：平时只是一行数字，点开才展开明细 */
.usage{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;
  font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.usage:hover{border-color:#c9ced6;background:var(--hover)}
.upanel{position:fixed;top:58px;right:18px;width:302px;background:#fff;border:1px solid var(--line);
  border-radius:8px;box-shadow:0 12px 30px rgba(17,20,24,.10);padding:14px 16px 12px;z-index:50;
  display:none;font-size:12px}
.upanel.show{display:block}
.upanel .uh{font-size:12.5px;font-weight:600}
.upanel .usub{color:var(--muted);font-size:11px;margin:2px 0 10px}
.upanel .uk{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.upanel .uk .k{color:var(--muted)}
.upanel .uk b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.upanel .div{height:1px;background:var(--line2);margin:9px 0}
.upanel .um{color:var(--muted);font-size:11px;margin:9px 0 3px;letter-spacing:.3px}
.upanel .ur{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:2px 0;color:var(--ink2)}
.upanel .ur span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upanel .ur .n{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.upanel .acts4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 2px}
.upanel .acts4 .c{text-align:center;border:1px solid var(--line2);border-radius:6px;padding:5px 0 4px}
.upanel .acts4 .c b{display:block;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.4}
.upanel .acts4 .c span{color:var(--muted);font-size:10.5px}

/* 历史记录：与用量面板同一层，列每次生成，可直接打开或下载成品 */
.hpanel{position:fixed;top:58px;right:18px;width:432px;max-height:74vh;overflow-y:auto;
  background:#fff;border:1px solid var(--line);border-radius:8px;
  box-shadow:0 12px 30px rgba(17,20,24,.10);padding:14px 16px 10px;z-index:50;
  display:none;font-size:12px}
.hpanel.show{display:block}
.hpanel .hh{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.hpanel .hh .x{border:0;background:transparent;color:#c9ced5;font-size:13px;padding:0 2px;line-height:1}
.hpanel .hh .x:hover{color:var(--red)}
.hpanel .hsub{color:var(--muted);font-size:11px;margin:2px 0 6px}
.hrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--line2)}
.hrow:last-child{border-bottom:0}
.hrow .co{font-size:12.5px;line-height:1.5;word-break:break-all}
.hrow .mt{color:var(--muted);font-size:11px;margin-top:2px;font-variant-numeric:tabular-nums}
.hrow .acts2{display:flex;gap:6px;flex:none}
.hrow .btn-sm{padding:4px 9px;font-size:11.5px}
.hempty{color:var(--muted);font-size:11.5px;padding:16px 0 12px;line-height:1.7}

.wrap{display:grid;grid-template-columns:318px 1fr;height:calc(100vh - 52px)}
aside{border-right:1px solid var(--line);overflow-y:auto;padding:16px 18px 96px}
main{overflow-y:auto;padding:26px 40px 90px}
/* 跳转落点：留一点上边距，别贴着顶栏 */
.doc .blk,.doc .seg,#d-doc{scroll-margin-top:14px}

.block{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line2)}
.block:last-child{border-bottom:0}
.row2{display:flex;gap:8px;margin-top:8px;align-items:center}
.row2 select{flex:1;min-width:0}
.row2 .btn{width:auto;flex:none;padding:8px 16px;white-space:nowrap}
.block .title{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.4px;margin-bottom:10px}

.field{display:flex;gap:6px}
.field input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:8px 10px;
  background:#fff;outline:none;font-size:13px}
.field input:focus{border-color:#c4c9d1}
.field button{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:6px;
  padding:0 14px;font-size:13px;white-space:nowrap}
.field button:hover{background:#000}
.field button:disabled{background:#c9ccd1;border-color:#c9ccd1;cursor:not-allowed}

/* 流程：四步手风琴
   同一时刻只展开一个步骤，展开态本身就是「做到哪一步」的指示器。
   折叠动画用 grid-template-rows:0fr→1fr，不写死高度——内容长短不一也不会跳；
   折叠的步骤给一层浅底与软阴影，展开的反而去掉阴影，让「当前这一步」看着是平的、贴住的。 */
.wiz{display:flex;flex-direction:column;gap:7px}
/* 折叠态一律压平（浅底、无阴影），只有展开的那一张浮起来。
   完成过的卡片用白底加一档边框，跟「还没开始」的浅底区分开——折叠成一排时也看得出进度。 */
.wstep{border:1px solid var(--line2);border-radius:9px;background:#fbfbfc;overflow:hidden;
  box-shadow:none;
  transition:box-shadow .28s ease,border-color .28s ease,background .28s ease}
.wstep.done{background:#fff;border-color:var(--line)}
.wstep.open{background:#fff;border-color:#cfd4db;
  box-shadow:0 1px 2px rgba(17,20,24,.04),0 12px 26px -20px rgba(17,20,24,.38)}
.wstep.error{background:#fff;border-color:#f0d5d1}
.whead{display:grid;grid-template-columns:19px 1fr auto 11px;gap:9px;padding:9px 11px 9px;
  cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;
  transition:background .2s ease}
.whead:hover{background:#fcfcfd}
.wstep.open .whead:hover{background:#fff}
.wstep.locked .whead{cursor:default}
.wstep.locked .whead:hover{background:transparent}
.wdot{grid-column:1;grid-row:1;width:19px;height:19px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-size:10px;line-height:1;color:var(--muted);margin-top:1px;
  transition:background .3s ease,color .3s ease,border-color .3s ease,transform .3s ease}
.wstep.done .wdot{background:var(--ink);border-color:var(--ink);color:#fff;font-size:11px}
.wstep.run .wdot{border-color:var(--ink);color:var(--ink);transform:scale(1.06)}
.wstep.error .wdot{border-color:var(--red);color:var(--red)}
.wstep.wait .wdot,.wstep.locked .wdot{border-color:#ebedf0;color:#cfd4db}
.wstep.open .wdot{border-color:#cfd4db;color:var(--ink2);font-weight:500}
.wstep.open.run .wdot{border-color:var(--ink);color:var(--ink)}
.wlabel{grid-column:2;grid-row:1;font-size:13px;color:#b8bec7;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .28s ease}
.wstep.done .wlabel{color:var(--ink2)}
.wstep.locked .wlabel{color:#c8ccd3}
.wstep.error .wlabel{color:var(--red)}
/* 放在最后：展开态压过上面所有状态（否则「当前这一步」反而最浅） */
.wstep.open .wlabel{color:var(--ink);font-weight:500}
.wpct{grid-column:3;grid-row:1;font-size:11px;color:var(--muted);
  font-variant-numeric:tabular-nums;margin-top:2px}
/* 折角用两条边画，展开时转 90 度；比字符箭头锐利，也不会随字体变宽 */
.wchev{grid-column:4;grid-row:1;width:8px;height:8px;margin-top:5px;
  border-right:1.5px solid #c4c9d1;border-bottom:1.5px solid #c4c9d1;
  transform:rotate(-45deg);transition:transform .3s cubic-bezier(.4,0,.2,1),border-color .3s}
.wstep.open .wchev{transform:rotate(45deg);border-color:var(--ink2)}
.wstep.locked .wchev{opacity:.3}
.wmeta{grid-column:2 / -1;grid-row:2;font-size:11px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .28s}
.wmeta:empty{display:none}
.wstep.open .wmeta{color:#6f7681}
.wbar{grid-column:2 / -1;grid-row:3;height:2px;background:var(--line2);border-radius:2px;
  overflow:hidden;margin-top:6px;display:none}
.wstep.run .wbar{display:block}
.wbar i{display:block;height:100%;background:var(--ink);width:0;transition:width .45s ease}

/* 折叠/展开：外层 0fr，展开 1fr；内层 overflow:hidden 负责裁切 */
.wbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1)}
.wstep.open .wbody{grid-template-rows:1fr}
.winner{overflow:hidden;min-height:0}
.wpad{padding:0 11px 11px;opacity:0;transform:translateY(-3px);
  transition:opacity .2s ease,transform .24s ease}
.wstep.open .wpad{opacity:1;transform:none;transition-delay:.07s}
.wpad .field{margin-top:0}
.wpad .up{margin-top:0}
.wfoot{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:nowrap}
/* 三个子元素各就各位：说明可缩可省、按钮按内容宽、下一步只占自己那点。
   少了 min-width:0 与 ellipsis，说明文字会被挤成一条竖排的窄柱（实测被压到 0 宽、撑高 153px）。 */
.wfoot .grow{flex:1 1 auto;min-width:0}
.wfoot .whint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wfoot .btn{flex:0 0 auto;width:auto}
.wfoot .ghost{flex:0 0 auto}
.whint{font-size:11px;color:var(--muted);line-height:1.55}
.ghost{border:0;background:transparent;color:var(--ink2);font-size:11.5px;padding:5px 2px;
  white-space:nowrap;transition:color .2s}
.ghost:hover:not(:disabled){color:var(--ink)}
.ghost:disabled{color:#d3d7dd;cursor:default}
/* 清单自己滚，别把下面的「读取」按钮挤出屏幕 */
#matList{max-height:min(40vh,320px);overflow-y:auto;overscroll-behavior:contain;
  margin-right:-4px;padding-right:4px}

/* 材料清单 */
.mat{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:start;
  padding:6px 0;border-bottom:1px solid var(--line2)}
.mat:last-child{border-bottom:0}
.mat input{margin:3px 0 0;width:13px;height:13px;accent-color:var(--ink);flex:none}
.mat .t{min-width:0;font-size:12.5px;line-height:1.5}
.mat .t .nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mat .t .meta{color:var(--muted);font-size:11px;margin-top:2px}
.mat .bar{display:block;height:2px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:5px}
.mat .bar i{display:block;height:100%;background:var(--ink);transition:width .4s ease}
.mat.done .meta{color:var(--ink2)}
.mat.error .meta{color:var(--red)}
.mat.wait{opacity:.5}
.matwrap{margin-top:8px}
.more{border:0;background:transparent;color:var(--muted);font-size:11.5px;padding:2px 0}
.more:hover{color:var(--ink)}
.grp{font-size:11.5px;color:var(--muted);margin:10px 0 2px}
.grp:first-child{margin-top:0}

/* 上传 */
.up{display:flex;align-items:center;gap:8px;padding:9px 10px;margin-top:12px;
  border:1px dashed #d8dce2;border-radius:6px;background:#fdfdfe;font-size:12.5px;color:var(--ink2)}
.up.hot{border-color:var(--ink);background:#f7f8f9}
.up .grow{flex:1;min-width:0}
.up .hint{color:var(--muted);font-size:11px;display:block;margin-top:1px}
.up button{border:1px solid var(--line);background:#fff;border-radius:5px;padding:4px 10px;font-size:12px}
.up button:hover{border-color:#c4c9d1}
.upfile{display:grid;grid-template-columns:14px 1fr 16px;gap:8px;align-items:start;
  padding:6px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.upfile .ico{color:var(--muted);font-size:11px;line-height:1.6;text-align:center}
.upfile .t{min-width:0}
.upfile .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upfile .meta{color:var(--muted);font-size:11px;margin-top:2px}
.upfile .bar{display:block;height:2px;background:var(--line2);border-radius:2px;overflow:hidden;margin-top:5px}
.upfile .bar i{display:block;height:100%;background:var(--ink);transition:width .3s ease}
.upfile.done .meta{color:var(--ink2)}
.upfile.error .meta{color:var(--red)}
.upfile .x{border:0;background:transparent;color:#c9ced5;font-size:12px;padding:0;line-height:1.5}
.upfile .x:hover{color:var(--red)}
.btn{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;
  padding:8px 12px;font-size:13px}
.btn:hover{border-color:#c4c9d1;background:var(--hover)}
.btn:disabled{color:#c2c7cf;border-color:var(--line2);background:#fff;cursor:not-allowed}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000}
.btn.primary:disabled{background:#c9ccd1;border-color:#c9ccd1;color:#fff}
select{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:#fff;
  font-size:12.5px;outline:none}

/* 文档区：正文与附加内容分栏
   正文始终是一列窄版心，左栏放候选观点、右栏放待核对——
   附加的东西有了自己的位置，就不再和正文抢同一行：按钮不会把企业名挤掉，
   正文也不会因为多一条提示而变窄。宽屏用三栏，窄屏退回一栏、依序落到正文下面。 */
.docgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.doccol{min-width:0;width:100%;max-width:756px;margin:0 auto}
.docbar{display:block;margin-bottom:16px}
.docbar .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.docbar .acts .end{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn-sm{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;font-size:12.5px}
.btn-sm:hover{border-color:#c4c9d1;background:var(--hover)}
.btn-sm.solid{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-sm.solid:hover{background:#000}
.btn-sm:disabled{color:#c2c7cf;border-color:var(--line2);cursor:not-allowed;background:#fff}
/* 图标只用描边、跟着字色走，深浅两档按钮都不用另配一套 */
.btn-sm .ic{width:13px;height:13px;flex:none;display:block;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn-sm.ico{display:inline-flex;align-items:center;gap:5px}

/* 标题两行：企业名独占一行，主体代码与字数挪到第二行小字 */
.doc-head{display:block;margin:0}
.in-company{display:block;width:100%;font-size:17px;padding:2px 4px;margin:0 -4px}
.doc-sub{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-top:3px;
  font-family:-apple-system,"PingFang SC",sans-serif;font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.doc-sub .subj{display:inline-flex;align-items:baseline;gap:1px;color:var(--ink);
  font-family:"Kaiti SC","KaiTi","STKaiti","Songti SC","SimSun",serif;font-size:14px;font-weight:700}
.doc-sub .subj .in-code{width:72px;font-size:14px}
.doc-sub .sep2{color:#d5d9de}

/* 宽屏：正文居中，两侧留白拿来做侧栏。
   中间那栏是 1fr + 整体限宽：屏幕窄于设计宽度时先收窄正文，侧栏保持宽度，
   三栏加起来不会超过视口，也就不出横向滚动条。
   侧栏跟着 main 一起粘住，勾到第 8 条时还能看见正文同一处。
   （这条必须写在上面基础规则之后，否则被同权重的单栏规则盖掉。） */
@media(min-width:1500px){
  main{padding-left:28px;padding-right:28px}
  .docgrid{grid-template-columns:190px minmax(0,1fr) 214px;gap:18px;
    max-width:1196px;margin:0 auto;align-items:start}
  .doccol{max-width:none}
  .docgrid.nol{grid-template-columns:minmax(0,1fr) 214px;max-width:970px}
  .docgrid.nor{grid-template-columns:190px minmax(0,1fr);max-width:946px}
  .docgrid.nol.nor{grid-template-columns:minmax(0,1fr);max-width:756px}
  .rail{position:sticky;top:6px;max-height:calc(100vh - 52px - 18px);overflow-y:auto;
    overscroll-behavior:contain;padding:3px 2px 26px;scrollbar-width:thin}
  .rail::-webkit-scrollbar{width:6px}
  .rail::-webkit-scrollbar-thumb{background:#e3e6ea;border-radius:3px}
  /* 右栏与正文首段对齐：让过工具条与企业名两行 */
  .rail-r{padding-top:120px}
}
@media(min-width:1780px){
  .docgrid{grid-template-columns:212px minmax(0,1fr) 238px;gap:24px;max-width:1278px}
  .docgrid.nol{grid-template-columns:minmax(0,1fr) 238px;max-width:1042px}
  .docgrid.nor{grid-template-columns:212px minmax(0,1fr);max-width:1016px}
  .docgrid.nol.nor{grid-template-columns:minmax(0,1fr);max-width:780px}
}

/* 打包下载：按钮下挂一层勾选面板，白底、细线，不遮挡正文 */
.pkgwrap{position:relative;display:inline-block}
.pkgpanel{position:absolute;right:0;top:calc(100% + 8px);width:356px;background:#fff;
  border:1px solid var(--line);border-radius:8px;box-shadow:0 14px 34px rgba(17,20,24,.12);
  padding:13px 14px 11px;display:none;z-index:45;text-align:left;white-space:normal;cursor:default}
.pkgpanel.show{display:block}
.pkgpanel .pk-h{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.pkgpanel .pk-h .x{border:0;background:transparent;color:#c9ced5;font-size:13px;padding:0 2px;line-height:1}
.pkgpanel .pk-h .x:hover{color:var(--red)}
.pkgpanel .pk-sub{color:var(--muted);font-size:11px;margin:2px 0 4px}
.pkgpanel .pk-body{max-height:min(58vh,420px);overflow-y:auto;padding-right:4px;margin-right:-4px}
.pkgpanel .pkgrp{font-size:11px;color:var(--muted);letter-spacing:.3px;margin:10px 0 2px;
  display:flex;justify-content:space-between;gap:8px}
.pkgpanel .pkgrp button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:0}
.pkgpanel .pkgrp button:hover{color:var(--ink)}
.pkrow{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:start;
  padding:5px 0;border-bottom:1px solid var(--line2);font-size:12px;cursor:pointer}
.pkrow:last-child{border-bottom:0}
.pkrow input{margin:3px 0 0;width:13px;height:13px;accent-color:var(--ink);flex:none}
.pkrow .nm{display:block;line-height:1.5;word-break:break-all;color:var(--ink2)}
.pkrow .meta{color:var(--muted);font-size:11px;display:block}
.pkrow.none{color:var(--muted);font-size:11.5px;display:block;border:0;padding:2px 0 4px;cursor:default}
.pk-foot{display:flex;align-items:center;gap:8px;margin-top:11px}
.pk-foot .sum{flex:1;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.pk-foot .btn-sm{flex:none}

/* ── 发送邮件面板 ───────────────────────────────────────────── */
.mlpanel{position:absolute;right:0;top:calc(100% + 8px);width:392px;background:#fff;
  border:1px solid var(--line);border-radius:8px;box-shadow:0 14px 34px rgba(17,20,24,.12);
  padding:13px 14px 12px;display:none;z-index:46;text-align:left;white-space:normal;cursor:default}
.mlpanel.show{display:block}
.mlpanel .ml-h{font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.mlpanel .ml-h .x{border:0;background:transparent;color:#c9ced5;font-size:13px;padding:0 2px;line-height:1}
.mlpanel .ml-h .x:hover{color:var(--red)}
.mlpanel .ml-sub{color:var(--muted);font-size:11px;margin:2px 0 8px}
.mlf{display:grid;grid-template-columns:44px 1fr;gap:6px 8px;align-items:center;margin-bottom:7px}
.mlf label{font-size:11.5px;color:var(--muted);text-align:right}
.mlf input,.mlf textarea{width:100%;font-family:inherit;font-size:12px;color:var(--ink);
  border:1px solid var(--line);border-radius:4px;padding:4px 7px;outline:none;background:#fff}
.mlf input:focus,.mlf textarea:focus{border-color:#cfd4dc}
.mlf textarea{resize:vertical;min-height:52px;line-height:1.6}
.mlf .full{grid-column:2}
.mlatt{font-size:12px;border-top:1px solid var(--line2);padding-top:8px;margin-top:2px}
.mlatt .r{display:flex;align-items:flex-start;gap:7px;padding:3px 0;cursor:pointer}
.mlatt input{width:13px;height:13px;margin:2px 0 0;accent-color:var(--ink);flex:none}
.mlatt .n{line-height:1.5;color:var(--ink2);word-break:break-all}
.mlatt .n i{display:block;color:var(--muted);font-size:10.5px;font-style:normal}
.ml-foot{display:flex;align-items:center;gap:8px;margin-top:10px}
.ml-foot .st{flex:1;font-size:10.5px;color:var(--muted);line-height:1.4}
.ml-foot .st.err{color:var(--red)}
.ml-cfg{border-top:1px dashed var(--line);margin-top:9px;padding-top:9px}
.ml-cfg .t{font-size:11px;color:var(--muted);margin-bottom:6px}
.ml-cfg .hint{font-size:10.5px;color:var(--muted);line-height:1.6;margin-top:6px}

.doc{font-family:"Kaiti SC","KaiTi","STKaiti","Songti SC","SimSun",serif;
  font-size:15.5px;line-height:1.82;color:#1b1f24}
.doc-head input{border:0;background:transparent;outline:none;font-family:inherit;font-weight:700}
.in-code{font-size:16.5px;padding:1px 2px;border:0;border-bottom:1px solid var(--line)!important;
  background:transparent;outline:none;font-family:inherit;
  text-align:center;font-weight:400!important}
/* ── 版式：块间一个空行，块内不留 ───────────────────────────────
   --pgap 就是「一个空行」的高度（等于正文字号）。所有块间距都取这一个值，
   所以「各板块空行多少」不再是各处手调的 8/12/22/26，只有一处。
   工具条上的「空行」开关只是把它切成 0，页面与导出 Word 一起吃这个开关。 */
.doc{--pgap:1.05em}
.doc.tight{--pgap:0px}
.doc .blk+.blk{margin-top:var(--pgap)}
.doc .blk>*+*{margin-top:0}
.doc-h{font-weight:700;font-size:15.5px;margin:0}
.doc-h+.items,.doc-h+textarea{margin-top:2px}
/* 楷体本身没有第二档字重，font-weight:700 在浏览器里几乎看不出粗细，
   和导出 Word 的加粗对不上。用四向文字阴影补一点笔画厚度，只加在正文楷体区。 */
.doc .doc-h,.doc .ta.lead{
  -webkit-text-stroke:.3px currentColor;
  text-shadow:.42px 0 0 currentColor,-.42px 0 0 currentColor,0 .42px 0 currentColor,0 -.42px 0 currentColor}

.ta{display:block;width:100%;border:1px solid transparent;border-radius:4px;background:transparent;
  padding:1px 4px;margin:0 -4px;line-height:inherit;font-family:inherit;font-size:inherit;
  resize:none;overflow:hidden;outline:none;color:inherit;text-indent:0}
.ta:hover{border-color:var(--line2);background:#fcfcfd}
.ta:focus{border-color:#cfd4dc;background:#fff}
.ta.lead{font-weight:700}
/* ── 正面 / 关注 的条目 ──────────────────────────────────────────
   一行 = 序号（兼作拖动把手）＋ 正文 ＋ 右上角删除圈。
   删除圈平时不显形，鼠标移到这一行才浮出来；右侧留一条空槽给它，
   所以出现时正文不会重排（叠在字上会挡住最后一两个字，重排又会让整段跳）。
   触屏没有 hover，手机上一律显示。 */
.items{display:flex;flex-direction:column;gap:1px}
.item{position:relative;display:flex;gap:2px;align-items:flex-start;padding-right:24px;
  border-radius:5px}
.item>.num{white-space:nowrap;padding:1px 2px 1px 0;cursor:grab;touch-action:none;
  border-radius:3px;transition:background .14s ease,color .14s ease}
.item>.num:hover{background:#f1f3f6;color:var(--ink)}
.item>.num:active{cursor:grabbing}
.item>.ta{flex:1;min-width:0}
.item .del{position:absolute;right:0;top:2px;width:18px;height:18px;padding:0;border-radius:50%;
  display:grid;place-items:center;border:1px solid #e4e7ec;background:#fff;color:#a9b0ba;
  opacity:0;transform:scale(.86);pointer-events:none;z-index:2;
  box-shadow:0 1px 2px rgba(17,20,24,.05);
  transition:opacity .14s ease,transform .14s ease,background .14s ease,border-color .14s ease,
    color .14s ease}
.item:hover .del,.item:focus-within .del{opacity:1;transform:none;pointer-events:auto}
.item .del:hover{background:var(--red);border-color:var(--red);color:#fff}
.item .del:active{transform:scale(.92)}
.item .del svg{width:9px;height:9px;fill:none;stroke:currentColor;stroke-width:2.1;
  stroke-linecap:round}
.item.gone{opacity:0;transform:translateX(4px);transition:opacity .13s ease,transform .13s ease}
/* 落位后回一下底色，确认它停在这儿了 */
.item.settle{animation:settleRow .85s ease-out}
@keyframes settleRow{0%{background:#eff3f8}70%{background:#f7f9fc}100%{background:transparent}}
/* 拖动：原位留虚线占位，跟着走的是浮起的影子 */
.item.drag-src{display:none}
.item.ph{background:#f5f7fa;border:1px dashed #ccd3dc;border-radius:5px}
body.dragging{cursor:grabbing;user-select:none;-webkit-user-select:none}
body.dragging .item-ghost{display:flex}
.item-ghost{position:fixed;left:0;top:0;z-index:120;display:none;align-items:flex-start;gap:2px;
  padding-right:24px;overflow:hidden;pointer-events:none;background:#fff;border-radius:6px;
  will-change:transform;
  box-shadow:0 12px 30px rgba(17,20,24,.16),0 0 0 1px rgba(17,20,24,.06)}
.item-ghost>.num{white-space:nowrap;padding:1px 2px 1px 0;color:var(--ink2)}
.item-ghost>.ta{flex:1;min-width:0;border-color:transparent;background:transparent}
.item-ghost .del{display:none}
.pool{margin:6px 0 0}
.pool-t{font-size:11px;color:var(--muted);margin-bottom:4px}
.chip{display:block;width:100%;text-align:left;font-family:inherit;font-size:11.5px;
  color:var(--ink2);background:#fbfcfd;border:1px solid var(--line2);border-radius:4px;
  padding:3px 8px;margin:3px 0;cursor:pointer;line-height:1.55;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.chip:hover{background:#f4f7fc;border-color:#d6ddea;color:var(--ink)}
.tool{border:0;background:transparent;color:#c2c7cf;font-size:12px;padding:0 3px;line-height:1.9;
  opacity:0;transition:opacity .15s}
.item:hover .tool,.seg:hover .tool,.topic:hover .tool{opacity:1}
.tool:hover{color:var(--red)}
.add{border:0;background:transparent;color:var(--muted);font-size:12px;padding:2px 4px}
.add:hover{color:var(--ink)}
/* 拖动是把序号当把手，不说一句没人会去试；只有一条时没必要提 */
.addhint{font-family:-apple-system,"PingFang SC",sans-serif;font-size:10.5px;
  color:#c3c8d0;margin-left:6px;letter-spacing:.01em}
.addhint.off{display:none}
.unit{text-align:right;color:var(--ink2);font-size:13.5px;margin:6px 0 2px}
.doc-table{width:100%;border-collapse:collapse;font-size:13.5px;
  border-top:1.5px solid #111;border-bottom:1.5px solid #111;margin-bottom:4px}
.doc-table th,.doc-table td{padding:3px 8px;border-right:.5px solid #c9ccd1;
  border-bottom:.5px solid #c9ccd1;font-weight:400;text-align:right;vertical-align:middle}
.doc-table th{font-weight:700;text-align:center}
.doc-table th:first-child,.doc-table td:first-child{text-align:left}
.doc-table tr>*:last-child{border-right:0}
.doc-table tbody tr:last-child>*{border-bottom:0}
.seg{position:relative}
.seg+.seg{margin-top:var(--pgap)}
.seg-line{line-height:1.85;padding:1px 16px 1px 0;border-radius:4px;outline:none;
  white-space:pre-wrap;word-break:break-word}
.seg-line:hover{background:#fcfcfd}
.seg-line:focus{background:#fff;box-shadow:0 0 0 1px #e6e9ee inset}
.seg .tool{position:absolute;right:0;top:4px}
.topic+.topic{margin-top:var(--pgap)}
.tp-add{position:relative;display:inline-block}
.tpmenu{position:absolute;left:0;top:calc(100% + 4px);min-width:176px;background:#fff;
  border:1px solid var(--line);border-radius:7px;box-shadow:0 10px 26px rgba(17,20,24,.12);
  padding:4px;display:none;z-index:30}
.tpmenu.show{display:block}
.tpmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;
  font-family:inherit;font-size:12px;color:var(--ink2);padding:6px 9px;border-radius:5px;cursor:pointer}
.tpmenu button:hover{background:var(--hover);color:var(--ink)}
/* ── 侧栏：候选观点（左）／待核对（右） ───────────────────────────
   两栏只在宽屏出现，位置在正文版心之外的留白里，与正文各自独立滚动。
   窄屏时退回正文内部：候选观点回到各自的板块下面，待核对落到正文之后。 */
.rail{min-width:0;font-family:-apple-system,"PingFang SC",sans-serif;font-size:12px}
.rail-h{display:flex;align-items:baseline;gap:6px;font-size:11px;color:var(--muted);
  letter-spacing:.06em;margin:0 0 8px}
.rail-h::after{content:"";flex:1;height:1px;background:var(--line2);transform:translateY(-4px)}
.rail-l .pool+.pool{margin-top:14px}
.rail-l .pool-t{font-size:10.5px;letter-spacing:.04em;color:var(--muted);margin-bottom:5px}
.rail-l .chip{white-space:normal;line-height:1.55;padding:5px 8px;font-size:11.5px}

/* 待核对：按「一类问题」分组，一组一卡。
   一个数目类问题常有十来个待核数，逐条打勾等于点十几次——所以组头带一个全选框，
   勾一次把整组销账；单条要单独确认时，再点行首那个框。
   行本身点一下会跳到正文里那句话并把它选中，勾选框自己吃掉点击，两者不冲突。 */
.ck-h{display:flex;align-items:baseline;gap:6px;margin:0 0 6px}
.ck-h b{font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:600}
.ck-h .n{font-size:11px;color:var(--ink2);margin-left:auto;font-variant-numeric:tabular-nums}
.ck-h button{border:0;background:none;font-size:11px;padding:0 0 0 6px;cursor:pointer;color:#c6cbd2}
.ck-h button:hover{color:var(--ink2)}
.ck-h button.ck-all{color:#2f5fd0}
.ck-h button.ck-all:hover{color:#1d47a8}
/* 折起：手机上十几条核对项会占掉半屏，默认折成一行，点开展开 */
.ck-fold{border:0;background:none;color:#b9bfc8;font-size:9px;padding:0 1px;line-height:1;
  cursor:pointer;transform:translateY(-1px)}
.ck-fold:hover{color:var(--ink2)}
.rail-r.collapsed .ck-list,.rail-r.collapsed .ck-bar,.rail-r.collapsed .ck-auto{display:none}
.rail-r.collapsed .ck-h{margin-bottom:0}
.ck-bar{height:2px;background:var(--line2);border-radius:2px;margin:0 0 9px;overflow:hidden}
.ck-bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .25s ease}

/* 一组一卡 */
.ckg{border:1px solid var(--line);border-radius:7px;background:#fff;margin-bottom:7px;
  transition:border-color .16s ease,background .16s ease}
.ckg:hover{border-color:#d3d8de}
.ckg-h{display:flex;align-items:flex-start;gap:7px;padding:8px 9px}
.ckg-h input{width:14px;height:14px;flex:none;margin:2px 0 0;accent-color:var(--ink);cursor:pointer}
.ckg-h .t{flex:1;min-width:0;font-size:12px;font-weight:600;color:var(--ink);line-height:1.55;
  cursor:pointer;overflow-wrap:break-word}
.ckg-h .c{flex:none;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;
  padding-top:2px}
.ckg-h .ckg-all{flex:none;border:0;background:none;color:#2f5fd0;font-size:10.5px;padding:1px 0 0;
  cursor:pointer}
.ckg-h .ckg-all:hover{text-decoration:underline}
.ckg-b{border-top:1px dashed var(--line2);padding:4px 9px 7px}
.ckg.done{background:#fafbfc;border-color:var(--line2)}
.ckg.done .ckg-h .t{color:#9aa1ac}

/* 组内一行 = 一个待核对象 */
.ckr{display:flex;align-items:flex-start;gap:6px;padding:3px 0;cursor:pointer;border-radius:4px}
.ckr:hover{background:#f7f9fc}
.ckr input{width:13px;height:13px;flex:none;margin:3px 0 0;accent-color:var(--ink);cursor:pointer}
.ckr .m{flex:1;min-width:0;line-height:1.55}
.ckr .k{font-size:11.5px;color:var(--ink);font-variant-numeric:tabular-nums;
  overflow-wrap:break-word}
.ckr .p{font-size:10.5px;color:#b0b6bf;margin-left:5px;white-space:nowrap}
.ckr .s{display:block;font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ckr .f{display:block;font-size:10.5px;color:#7a828c;line-height:1.5;margin-top:1px;
  font-variant-numeric:tabular-nums}
.ckr.done .k,.ckr.done .s{color:#b6bcc4;text-decoration:line-through}
.ckr.done .f{color:#cfd4da}
.ckr .go{flex:none;color:#d3d8de;font-size:10px;padding-top:2px}
.ckr:hover .go{color:var(--ink2)}

/* 机器自己核对过的：默认收起，点开看算式——不然用户会以为数字凭空少了 */
.ck-auto{margin-top:8px;border-top:1px solid var(--line2);padding-top:7px}
.ck-auto summary{cursor:pointer;font-size:10.5px;color:#5b7a2e;list-style:none;outline:none}
.ck-auto summary::-webkit-details-marker{display:none}
.ck-auto summary::before{content:"▸ ";color:var(--muted)}
.ck-auto[open] summary::before{content:"▾ "}
.ck-auto .lst{margin:5px 0 0;font-size:10.5px;color:var(--ink2);line-height:1.6;
  max-height:180px;overflow-y:auto}
.ck-auto .lst div{padding:2px 0;border-bottom:1px solid #f4f6f8;overflow-wrap:break-word}
.ck-auto .lst div:last-child{border-bottom:0}
.ck-auto .lst b{font-weight:500;color:var(--ink)}
/* 勾完的整块换个颜色，剩下的自然浮上来 */
.rail-r.all-done .ck-h b{color:#2e7d32}
/* 跳到正文时的落点提示：底色与左侧竖条闪一下，两秒后自己退掉 */
.flash{animation:ckflash 1.9s ease-out;border-radius:4px}
@keyframes ckflash{
  0%,45%{background:#fffaf0;box-shadow:inset 3px 0 0 #d9a441}
  100%{background:transparent;box-shadow:inset 0 0 0 rgba(0,0,0,0)}
}
.empty{color:#c2c7cf;font-size:13px;text-align:center;padding:120px 0;
  font-family:-apple-system,"PingFang SC",sans-serif}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(8px);
  background:#111418;color:#fff;font-size:12.5px;padding:8px 16px;border-radius:6px;
  opacity:0;pointer-events:none;transition:.2s;max-width:80vw;
  display:flex;align-items:center;gap:12px}
/* 删了能撤回：删的是一条完整观点，没有撤销就太脆了 */
#toast .undo{flex:none;border:0;background:transparent;color:#8fc7ff;font:inherit;font-size:12.5px;
  padding:0;text-decoration:underline;text-underline-offset:2px}
#toast .undo:hover{color:#cfe4ff}

/* ── 口令闸门：没进来之前，整页糊在毛玻璃后面 ───────────────────── */
#gate{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
  background:rgba(255,255,255,.5);
  -webkit-backdrop-filter:blur(16px) saturate(.8);backdrop-filter:blur(16px) saturate(.8)}
#gate.show{display:flex}

/* ── 设置（模型 API / 邮件 SMTP / 财汇 / 口令，统一一处） ─────────── */
#setMask{position:fixed;inset:0;z-index:70;display:none;background:rgba(17,20,24,.28);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#setMask.show{display:flex;align-items:center;justify-content:center}
.setbox{width:560px;max-height:82vh;overflow:auto;background:#fff;border-radius:10px;
  box-shadow:0 20px 60px rgba(17,20,24,.20);padding:0;text-align:left}
.setbox .sh{display:flex;align-items:center;gap:8px;padding:16px 20px 12px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.setbox .sh b{font-size:14px}
.setbox .sh .x{margin-left:auto;border:0;background:transparent;color:#b9bfc8;font-size:16px;
  cursor:pointer;line-height:1;padding:2px 4px}
.setbox .sh .x:hover{color:var(--red)}
.sets{padding:6px 20px 20px}
.setsec{border-bottom:1px solid var(--line2);padding:14px 0}
.setsec:last-child{border-bottom:0}
.setsec .st{font-size:12.5px;font-weight:600;margin-bottom:2px;display:flex;align-items:center;gap:6px}
.setsec .sd{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:8px}
.setsec .badge{font-size:10px;font-weight:400;padding:1px 6px;border-radius:9px;
  border:1px solid var(--line);color:var(--muted);background:#fafbfc}
.setsec .badge.ok{color:#2e7d32;border-color:#c8e6c9;background:#f1f8f1}
.setsec .badge.warn{color:#9a6700;border-color:#f0e0b8;background:#fffbf0}
.setgrid{display:grid;grid-template-columns:66px 1fr;gap:7px 10px;align-items:center}
.setgrid label{font-size:11.5px;color:var(--muted);text-align:right}
.setgrid input,.setgrid select{width:100%;font-family:inherit;font-size:12.5px;color:var(--ink);
  border:1px solid var(--line);border-radius:5px;padding:5px 8px;outline:none;background:#fff}
.setgrid input:focus,.setgrid select:focus{border-color:#cfd4dc}
.setgrid .wide{grid-column:1 / -1}
.setact{display:flex;align-items:center;gap:8px;margin-top:9px}
.setact .msg{flex:1;font-size:11px;color:var(--muted)}
.setact .msg.err{color:var(--red)}
.setact .msg.ok{color:#2e7d32}

/* ── 版本历史（每次改动一份可运行的快照） ───────────────────────── */
#verMask{position:fixed;inset:0;z-index:71;display:none;background:rgba(17,20,24,.28);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#verMask.show{display:flex;align-items:center;justify-content:center}
.verbox{width:640px;max-height:82vh;overflow:auto;background:#fff;border-radius:10px;
  box-shadow:0 20px 60px rgba(17,20,24,.20);text-align:left}
.verbox .vh{display:flex;align-items:center;gap:8px;padding:15px 20px 12px;
  border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.verbox .vh b{font-size:14px}
.verbox .vh .n{font-size:11.5px;color:var(--muted)}
.verbox .vh .x{margin-left:auto;border:0;background:transparent;color:#b9bfc8;
  font-size:16px;cursor:pointer;line-height:1;padding:2px 4px}
.verbox .vh .x:hover{color:var(--red)}
.vlist{position:relative;padding:4px 20px 16px}
.vlist::before{content:"";position:absolute;left:24px;top:10px;bottom:18px;width:1px;background:var(--line)}
.vi{position:relative;padding:12px 0 11px 22px;border-bottom:1px solid var(--line2)}
.vi:last-child{border-bottom:0}
.vi::before{content:"";position:absolute;left:1px;top:17px;width:7px;height:7px;border-radius:50%;
  background:#fff;border:1.5px solid #c3c9d2}
.vi.cur::before{background:#16191d;border-color:#16191d}
.vi .meta{display:flex;align-items:baseline;gap:8px;font-size:11px;color:var(--muted)}
.vi .meta .lab{font-weight:600;color:var(--ink2);letter-spacing:.03em}

/* ── 手机（≤640px）────────────────────────────────────────────────
   四条原则：
   1. 不再让两栏各自滚动——手机上只有一条滚动轴，否则手指一动就滚错层；
   2. 悬浮面板一律改成底部抽屉（bottom sheet），因为顶栏会折成两行、锚点算不准；
   3. 输入框全部 16px，低于这个值 iOS 会在聚焦时自动放大页面，且退不回去；
   4. 触屏没有 hover，删除按钮不能靠悬停才显形。 */
@media(max-width:640px){
  html{-webkit-text-size-adjust:100%}

  /* 顶栏：一条横向滑动的动作带。
     折行会吃掉 88px（390 宽）到 126px（320 宽），手机上这相当于少看半屏正文；
     给它一条横向滚动轴，高度就固定在 52px。 */
  header{height:52px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;gap:8px;
    padding:0 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  header::-webkit-scrollbar{display:none}
  header .brand{font-size:14.5px;flex:none}
  header .spacer{display:none}
  header .sep{display:none}
  header>*{flex:none}
  header::after{content:"";flex:none;width:2px}
  header a{font-size:12px;padding:6px 4px;min-height:32px;display:inline-flex;align-items:center}
  .usage{padding:5px 11px;font-size:12px;min-height:32px}

  /* 单栏单滚动 */
  .wrap{display:block;height:auto}
  aside{overflow:visible;padding:14px 14px 8px;border-bottom:1px solid var(--line)}
  main{overflow:visible;padding:14px 14px calc(80px + env(safe-area-inset-bottom,0px))}


  /* 底部抽屉：用量、历史、打包、发信、设置、版本 */
  .upanel,.hpanel{position:fixed;left:10px;right:10px;width:auto;top:auto;bottom:10px;
    max-height:72vh;overflow-y:auto;z-index:60}
  .pkgpanel,.mlpanel{position:fixed;left:10px;right:10px;width:auto;top:auto;
    bottom:calc(10px + env(safe-area-inset-bottom,0px));max-height:76vh;overflow-y:auto;
    overscroll-behavior:contain;z-index:60}
  .pkgpanel .pk-body{max-height:none;overflow:visible}
  /* 发送 / 打包的确认按钮同样粘在抽屉底部：抽屉是内部滚动的，
     按钮原本在流末尾，手机上得先滚到底才看得见。 */
  .ml-foot,.pk-foot{position:sticky;bottom:0;z-index:3;margin-top:10px;
    padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px) * 0);
    background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 26%)}
  .ml-foot .st{font-size:11px}
  .ml-foot .btn-sm,.pk-foot .btn-sm{padding:9px 14px;font-size:13px}
  .setbox,.verbox{width:calc(100% - 20px);max-height:88vh;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .setgrid{grid-template-columns:1fr;gap:4px}
  .setgrid label{text-align:left;font-size:11px;margin-top:4px}
  .setgrid .wide{grid-column:1}

  /* 保存按钮必须自己粘在面板底部。
     四个分区合计约 1500px，而手机面板只有 88vh 高——按钮原本落在第 935px，
     屏幕根本到不了那里；手指滑的是背后的页面，面板内部不动，看着就是「点不到保存」。
     sticky bottom 让它停留在所属分区的可视底部，滚到哪一段就能存哪一段。 */
  .setsec{padding-bottom:6px}
  .setact{position:sticky;bottom:0;z-index:3;margin:8px -4px 0;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px) * 0);
    background:linear-gradient(to bottom,rgba(255,255,255,0),#fff 26%);
    align-items:center}
  .setact .msg{font-size:11.5px}
  .setact .btn-sm{flex:none;padding:9px 14px;font-size:13px}
  /* 说明文字占高度，手机上折成三行就够，剩下的要留给字段 */
  .setsec .sd{font-size:11px;line-height:1.55;margin-bottom:6px}
  .gcard{width:calc(100% - 40px);padding:22px 18px 18px}
  /* 登录框同样要 16px：iOS 在聚焦时会为 <16px 的输入框自动放大整页 */
  .gcard input{font-size:16px;padding:10px 12px}
  .gcard button{min-height:42px}
  #toast{max-width:92vw;bottom:calc(16px + env(safe-area-inset-bottom,0px))}

  /* 字号：正文与输入框都提到 16px，既好读也避开 iOS 自动缩放 */
  .doc{font-size:16px;line-height:1.9}
  .field input,#company,select,.setgrid input,.mlpanel input,.mlpanel textarea{font-size:16px}
  .ta{font-size:16px}

  /* 工具条：按钮换行，不再挤成一条 */
  /* 步骤卡：标题行 44px 起，拇指好点；辅助说明在窄屏省掉，宽度让给按钮 */
  .whead{padding:11px 11px;min-height:44px;align-items:center}
  .wdot{margin-top:0}
  .wchev{margin-top:0}
  .wmeta{grid-row:2}
  .wstep .wfoot .whint{display:none}
  .wfoot{flex-wrap:wrap;row-gap:8px}
  .wfoot .btn{flex:1 1 120px;min-width:0}
  .wfoot .ghost{min-height:38px;padding:8px 4px}
  .wpad{padding:0 11px 12px}

  /* 单栏：两侧栏退回正文内部（候选观点回各自板块，待核对排在工具条下面） */
  .docgrid{display:block}
  .rail{position:static;max-height:none;overflow:visible;padding:0}
  .doccol{max-width:none}
  .docbar{margin-bottom:12px}
  .docbar .acts{gap:6px}
  .docbar .acts .end{margin-left:0;flex-wrap:wrap}
  .in-company{font-size:16px}
  .doc-sub .subj .in-code{width:84px}
  /* 触屏上的核对项：勾选框与整张卡片都要够大 */
  .ckg-h{padding:10px}
  .ckg-h input{width:19px;height:19px;margin-top:1px}
  .ckg-h .t{font-size:13px}
  .ckg-b{padding:4px 10px 9px}
  .ckr{padding:6px 0}
  .ckr input{width:18px;height:18px;margin-top:2px}
  .ckr .k{font-size:12.5px}
  .ckr .p,.ckr .s,.ckr .f{font-size:11px}
  .ckr .go{display:none}
  .rail-r{margin:2px 0 16px}

  /* 表格：整表横向滑动，单元格不折行，否则「-10.66%」会被拆成两行看错 */
  .tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
  .doc-table{min-width:100%;width:auto}
  .doc-table th,.doc-table td{white-space:nowrap;padding:4px 10px;font-size:14px}
  .doc-table th:first-child,.doc-table td:first-child{position:sticky;left:0;background:#fff;z-index:1}

  /* 触屏没有 hover：删除按钮与候选条常显，且加大点击区 */
  .item .tool,.seg .tool,.topic .tool{opacity:1;font-size:15px;
    min-width:32px;min-height:32px;display:inline-flex;align-items:center;justify-content:center}
  .seg .tool{top:0}
  /* 条目上的删除圈同理：常显，并且放大到 24px 好按；右侧空槽跟着加宽 */
  .item{padding-right:30px}
  .item .del{width:24px;height:24px;opacity:1;transform:none;pointer-events:auto;top:0}
  .item .del svg{width:10px;height:10px}
  .item>.num{padding:2px 3px 2px 0}
  .chip{padding:8px 10px;font-size:12.5px;white-space:normal;line-height:1.5}
  .add{padding:8px 4px;font-size:13px}
  .pkgpanel .pkrow,.mlpanel .mlatt label.r{min-height:34px}
  /* 勾选框 13px 在手机上按不准 */
  input[type=checkbox]{width:18px;height:18px}
  .mat,.upfile,.pkrow,.mlatt label.r{align-items:center}

  /* 专题菜单贴右边，免得被屏幕切掉 */
  .tpmenu{left:auto;right:0}

  /* 手机上给两个跳转键：长报告里很难再滚回顶部的流程区。
     显隐由 syncFab() 按「正文是否进入视野」控制，不在这里常显。 */
}

<script>
const $ = (s) => document.querySelector(s);
const S = { company: "", facts: null, uploads: [], mstate: {}, loaded: [], draft: null, stats: null };

/* 后端在哪：三种情况都要能自己认出来
   1. 页面由后端自己发（本机 127.0.0.1 或云端域名）→ 同源，空串
   2. 页面在 GitHub Pages 这类静态站 → 要连本机 127.0.0.1:8770（可用 localStorage.apiBase 改）
   3. 用户在页面上手填过地址 → 以填的为准
   靠「同源能不能打通」来判断，比按域名硬编码稳——换域名、换部署方式都不用改代码。 */
let API_BASE = (() => {
  const custom = (localStorage.getItem("apiBase") || "").trim();
  if (custom) return custom.replace(/\/+$/, "");
  return (location.protocol === "file:") ? "http://127.0.0.1:8770" : "";
})();
const apiUrl = (p) => API_BASE + p;

async function probeBase(base){
  try{
    const r = await fetch((base || "") + "/api/health", { cache: "no-store" });
    if(!r.ok) return false;
    // 分享链接的网关在缺 sharecode 时会回一个 200 的 HTML 提示页，
    // 只看状态码会误判成「后端在」。必须确认回的是 JSON 且 ok:true。
    const d = await r.json().catch(() => null);
    return !!(d && d.ok);
  }catch(e){ return false; }
}

async function resolveApiBase(){
  if((localStorage.getItem("apiBase") || "").trim()) return;   // 用户手填的优先
  if(await probeBase(API_BASE)) return;                        // 同源即可
  if(!API_BASE && await probeBase("http://127.0.0.1:8770")){
    API_BASE = "http://127.0.0.1:8770";                        // 静态站 → 回落本机
  }
}

/* ── 访问口令 ──────────────────────────────────────────────────
   服务端每个接口都要 token；token 放 localStorage，随请求头带过去。
   下载走浏览器直接跳转（a[href]），带不了头，改用 ?t= 传。 */
let TOKEN = localStorage.getItem("nrToken") || "";
const authHead = () => TOKEN ? { Authorization: "Bearer " + TOKEN } : {};
const dlUrl = (p) => apiUrl(p) + (TOKEN ? (p.includes("?") ? "&" : "?") + "t=" + encodeURIComponent(TOKEN) : "");

const _fetch = window.fetch.bind(window);
window.fetch = (u, o) => {
  const opt = Object.assign({}, o || {});
  opt.headers = Object.assign({}, (o && o.headers) || {}, authHead());
  return _fetch(u, opt).then(r => {
    if(r.status === 401) lockUI("登录已过期，请重新输入口令");
    return r;
  });
};

function lockUI(msg){
  document.body.classList.add("locked");
  $("#gate").classList.add("show");
  $("#gateErr").textContent = msg || "";
  setTimeout(() => { const el = $("#gatePw"); if(el) el.focus(); }, 60);
}
function unlockUI(){
  document.body.classList.remove("locked");
  $("#gate").classList.remove("show");
  $("#gateErr").textContent = "";
  const el = $("#gatePw"); if(el) el.value = "";
}
async function doLogin(){
  const pw = ($("#gatePw").value || "").trim();
  const btn = $("#gateGo");
  if(!pw){ $("#gateErr").textContent = "请输入口令"; return; }
  btn.disabled = true; $("#gateErr").textContent = "";
  try{
    const r = await _fetch(apiUrl("/api/login"), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw }) });
    const d = await r.json().catch(() => ({}));
    if(!r.ok || !d.token) throw new Error(d.error || "口令不对");
    TOKEN = d.token;

const STEPS = [
  { key: "search", label: "检索主体" },
  { key: "materials", label: "读取材料" },
  { key: "generate", label: "生成草稿" },
  { key: "export", label: "导出报告" },
];
const ST = {};
STEPS.forEach(s => ST[s.key] = { state: "wait", pct: 0, detail: "" });

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* 手风琴：同一时刻只展开一步。
   OPEN_STEP 是唯一的状态源，其余靠给 .wstep 挂类名（open / done / run / error / locked）
   让 CSS 自己过渡，所以「回到上一步」不需要记额外的收起动作——开新的，旧的自动折叠。 */
let OPEN_STEP = "search";

function stepEl(key){ return document.getElementById("ws-" + key); }

function reached(key){
  const i = STEPS.findIndex(s => s.key === key);
  if(i < 0) return false;
  const st = ST[key] || {};
  if(st.state === "done" || st.state === "run" || st.state === "error") return true;
  return i === 0 || STEPS.slice(0, i).every(x => (ST[x.key] || {}).state === "done");
}

function openStep(key){
  if(!reached(key)) return;          // 没走到的步骤点不动，避免跳步
  const prev = OPEN_STEP;
  OPEN_STEP = key;
  paintSteps();
  if(prev !== key){
    // 展开后把它滚进视野：手机上第 2 步内容较长，不滚一下看不到刚展开的那一步
    const el = stepEl(key);
    if(el) setTimeout(() => {
      try{ el.scrollIntoView({ behavior: "smooth", block: "nearest" }); }catch(e){}
    }, 120);
  }
}

function nextStep(from){
  const i = STEPS.findIndex(s => s.key === from);
  const nx = STEPS[i + 1];
  if(!nx) return;
  openStep(nx.key);
}

function paintSteps(){
  if(!reached(OPEN_STEP)){
    const fallback = STEPS.find(x => (ST[x.key] || {}).state !== "done");
    OPEN_STEP = fallback ? fallback.key : STEPS[STEPS.length - 1].key;
  }
  STEPS.forEach((s, i) => {
    const st = ST[s.key] || { state: "wait", pct: 0, detail: "" };
    const el = stepEl(s.key);
    if(!el) return;
    const cls = ["wstep", st.state];
    if(OPEN_STEP === s.key) cls.push("open");
    if(!reached(s.key)) cls.push("locked");
    el.className = cls.join(" ");
    const dot = el.querySelector(".wdot");
    if(dot) dot.textContent = st.state === "done" ? "✓" : (st.state === "error" ? "!" : String(i + 1));
    const pct = el.querySelector(".wpct");
    if(pct) pct.textContent = st.state === "run" ? st.pct + "%" : "";
    const meta = el.querySelector(".wmeta");
    if(meta) meta.textContent = st.detail || "";
    const bar = el.querySelector(".wbar i");
    if(bar) bar.style.width = Math.max(2, st.pct || 0) + "%";
    const nx = el.querySelector(".wnext");
    if(nx) nx.disabled = st.state !== "done";
  });
  syncButtons();
}
function setStep(key, patch){ Object.assign(ST[key], patch); paintSteps(); }
function resetStepsFrom(key){
  const i = STEPS.findIndex(s => s.key === key);
  STEPS.slice(i).forEach(s => ST[s.key] = { state: "wait", pct: 0, detail: "" });
  OPEN_STEP = key;
  paintSteps();
}


let toastTimer = null;
function toast(msg, isErr){
  const el = $("#toast");
  el.textContent = msg;
  el.className = "show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ""; }, isErr ? 8000 : 4000);
}
/* 带「撤销」的提示：删除是即时生效的，给一次后悔的机会 */
let toastUndo = null;
function toastWithUndo(msg, onUndo){
  const el = $("#toast");
  el.textContent = "";
  const span = document.createElement("span");
  span.textContent = msg;
  const btn = document.createElement("button");
  btn.className = "undo";
  btn.textContent = "撤销";
  btn.onclick = () => {
    el.className = "";
    clearTimeout(toastTimer);
    toastUndo = null;
    onUndo();
  };
  el.append(span, btn);
  el.className = "show";
  clearTimeout(toastTimer);
  toastUndo = onUndo;
  toastTimer = setTimeout(() => { el.className = ""; toastUndo = null; }, 6000);
}
/* ⌘/Ctrl+Z 接上「撤销删除」：习惯用键盘的人不必去点那一行提示。
   只看当前焦点在哪：焦点在正在改字的输入框里，⌘Z 归输入框自己。 */
document.addEventListener("keydown", e => {
  if(!toastUndo) return;
  if(!((e.metaKey || e.ctrlKey) && !e.shiftKey && (e.key === "z" || e.key === "Z"))) return;
  const a = document.activeElement;
  if(a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT") && a.value) return;
  e.preventDefault();
  const fn = toastUndo;
  toastUndo = null;
  clearTimeout(toastTimer);
  $("#toast").className = "";
  fn();
});

async function api(path, body){
  const r = await fetch(apiUrl(path), { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {}) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok || data.error) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

async function runJob(kind, body, onTick){
  const { job } = await api("/api/jobs/" + kind, body);
  for(;;){
    await sleep(600);
    const r = await fetch(apiUrl("/api/jobs/" + job));
    const j = await r.json().catch(() => ({}));
    if(!r.ok) throw new Error(j.error || "任务状态读取失败");
    if(onTick) onTick(j);
    if(j.state === "done") return j;
    if(j.state === "error") throw new Error(j.error || "任务失败");
  }
}

let statsOpen = false;

function fmtNum(n){ return (n || 0).toLocaleString("en-US"); }
function fmtTok(n){
  n = n || 0;
  if(n >= 1e8) return (n / 1e8).toFixed(2) + " 亿";
  if(n >= 1e4) return (n / 1e4).toFixed(1) + " 万";
  return fmtNum(n);
}
function fmtSec(s){
  s = Math.round(s || 0);
  if(s >= 3600) return (s / 3600).toFixed(1) + " 小时";
  return s >= 60 ? (s / 60).toFixed(1) + " 分" : s + " 秒";
}

      setStep("search", { state: "run", pct: j.pct, detail: j.detail || j.stage });
    });

    S.facts = j.result.facts;
    S.keepChecked = null;

    setStep("materials", { state: "wait", pct: 0,
      detail: n ? `${n} 份待读取` : "未检索到，可上传 PDF" });
    toast(n ? `检索到 ${n} 份材料${calls ? " · 财汇 " + calls + " 点" : ""}`
            : "未检索到公告，可在下方上传 PDF");

  }
}

function toggleGrp(k){

function syncButtons(){

function setMS(title, patch){

function renderMaterials(f){
  const ms = (f && f.materials) || {};
  let html = "";
  for(const k of MAT_ORDER){
    const arr = ms[k] || [];
    const open = !!S.expand[k];
    const show = open ? arr : arr.slice(0, 2);
    html += `<div class="grp">${esc(k)}${arr.length ? "（" + arr.length + "）" : ""}</div>`;
    if(!arr.length){
      html += `<div style="font-size:12px;color:var(--muted);padding:2px 0 4px">未检索到</div>`;
      continue;
    }
    show.forEach((m, i) => {
      setMS(m.title, S.mstate[m.title] || { state: "wait", pct: 0, detail: m.date || "" });
      html += `<label class="mat">
        <input type="checkbox" class="mchk" data-url="${esc(m.url)}" data-title="${esc(m.title)}" ${(S.keepChecked ? S.keepChecked.has(m.title) : i === 0) ? "checked" : ""}/>
        <span class="t"><span class="nm">${esc(m.title)}</span>
        <span class="meta">${esc(m.date || "")}</span></span>
      </label>`;
    });

      html += `<button class="more" onclick="toggleGrp('${esc(k)}')">${open ? "收起" : `显示全部 ${arr.length} 条`}</button>`;
    }
  }
  $("#matList").innerHTML = html;
  paintMatStates();
  syncButtons();

function paintMatStates(){
  document.querySelectorAll("#matList .mat").forEach(el => {
    const cb = el.querySelector(".mchk");

    el.classList.toggle("wait", st.state === "wait" || st.state === "saved");
    el.classList.toggle("done", st.state === "done");
    el.classList.toggle("error", st.state === "error");
    let bar = el.querySelector(".bar");
    if(st.state === "run"){
      if(!bar){ bar = document.createElement("span"); bar.className = "bar"; bar.innerHTML = "<i></i>";
        el.querySelector(".t").appendChild(bar); }
      bar.querySelector("i").style.width = Math.max(3, st.pct) + "%";
    }else if(bar){ bar.remove(); }
    let meta = el.querySelector(".meta");
    if(st.detail) meta.textContent = st.detail;
  });
}

async function doFetch(){
  const picks = [...document.querySelectorAll(".mchk:checked")].map(el => ({ url: el.dataset.url, title: el.dataset.title }));
  if(!picks.length) return toast("请先勾选材料，或上传 PDF", true);
  busy.fetch = true; syncButtons();

  paintMatStates();
  setStep("materials", { state: "run", pct: 0, detail: `0/${picks.length} 份` });
  try{
    const j = await runJob("fetch", { company: S.company || $("#company").value.trim(), materials: picks }, j => {
      setStep("materials", { state: "run", pct: j.pct, detail: j.detail || "" });

    });

}

/* ---------------- 上传 ---------------- */
function fmtSize(n){
  if(n > 1048576) return (n / 1048576).toFixed(1) + " MB";
  return Math.max(1, Math.round(n / 1024)) + " KB";
}

async function onPick(input){
  const files = [...(input.files || [])];
  input.value = "";
  if(files.length) await uploadAll(files);
}

async function uploadAll(files){
  for(const f of files){
    if(!/\.pdf$/i.test(f.name)){ toast("只支持 PDF：" + f.name, true); continue; }
    const u = { title: f.name.replace(/\.pdf$/i, ""), size: f.size, state: "run", pct: 0, detail: "上传中" };
    S.uploads.push(u);
    renderUploads();
    const r = await uploadOne(f, u);
    if(!r) continue;
    u.title = r.title; u.path = r.path; u.state = "wait"; u.pct = 0; u.detail = "待读取";
    setMS(u.title, { state: "run", pct: 0, detail: "待读取" });
    renderUploads();
  }
  const ready = S.uploads.filter(u => u.path && u.state !== "error");
  if(ready.length){
    // 上传等于「拿到了材料」，第 1 步（检索）可以跳过：标成完成，直接放开第 2 步
    if(ST.search.state !== "done"){
      setStep("search", { state: "done", pct: 100,
        detail: `用本地上传的 ${ready.length} 份 PDF` });
    }
    openStep("materials");
  }
  const pending = ready.filter(u => S.mstate[u.title] && S.mstate[u.title].state !== "done");
  if(pending.length) await parseUploads(pending);
}

function uploadOne(file, u){
  return new Promise(resolve => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", apiUrl("/api/upload?name=" + encodeURIComponent(file.name)));
    xhr.setRequestHeader("Content-Type", "application/pdf");
    if(TOKEN) xhr.setRequestHeader("Authorization", "Bearer " + TOKEN);
    xhr.upload.onprogress = e => {
      if(!e.lengthComputable) return;
      u.pct = Math.round(e.loaded / e.total * 100);
      u.detail = "上传 " + u.pct + "%";
      renderUploads();
    };
    xhr.onload = () => {
      try{
        const r = JSON.parse(xhr.responseText || "{}");
        if(r.error) throw new Error(r.error);
        resolve(r);
      }catch(e){
        u.state = "error"; u.detail = e.message; renderUploads(); resolve(null);
      }
    };
    xhr.onerror = () => { u.state = "error"; u.detail = "上传失败，检查本机服务"; renderUploads(); resolve(null); };
    xhr.send(file);
  });
}

async function parseUploads(list){
  const picks = list.map(u => ({ path: u.path, title: u.title }));
  busy.fetch = true; syncButtons();
  setStep("materials", { state: "run", pct: 0, detail: `解析 0/${picks.length} 份` });
  try{
    const j = await runJob("fetch", { company: S.company || $("#company").value.trim(), materials: picks }, j => {
      setStep("materials", { state: "run", pct: j.pct, detail: j.detail || "" });
      if(j.items) onItems(j.items);
    });
    onItems(j.result.items || []);
    S.loaded = [...new Set([...S.loaded, ...(j.result.loaded || [])])];
    markMaterialsDone(picks.length);
  }catch(e){
    setStep("materials", { state: "error", detail: e.message });
    toast(e.message, true);
  }finally{
    busy.fetch = false; syncButtons();
  }

function renderUploads(){
  $("#upList").innerHTML = S.uploads.map((u, i) => {
    const st = S.mstate[u.title] || {};
    const state = u.state === "error" ? "error" : (st.state || u.state);
    const pct = state === "done" ? 100 : Math.max(u.pct || 0, st.pct || 0);
    const detail = u.state === "error" ? u.detail : (st.detail || u.detail || "");
    const bar = (state === "run" || state === "upload")
      ? `<span class="bar"><i style="width:${Math.max(3, pct)}%"></i></span>` : "";
    return `<div class="upfile ${state === "done" ? "done" : ""} ${state === "error" ? "error" : ""}">
      <span class="ico">${state === "done" ? "✓" : (state === "error" ? "!" : "·")}</span>
      <span class="t"><span class="nm">${esc(u.title)}</span>
      <span class="meta">${esc(fmtSize(u.size))}${detail ? " · " + esc(detail) : ""}</span>${bar}</span>
      <button class="x" title="移除" onclick="dropUpload(${i})">×</button>
    </div>`;
  }).join("");
}

function dropUpload(i){
  const u = S.uploads[i];
  if(!u) return;
  S.uploads.splice(i, 1);
  delete S.mstate[u.title];
  renderUploads();
}

/* ── 待核对事项 ────────────────────────────────────────────────
   后端给回来的 issues 是一串自然语言：有的一句话，有的首行是汇总、后面跟明细。
   这里做三件事：
   ① 拆成一条一张卡，配一句短标题（标题按问题类型取名，原句放进小字里，不重复）；
   ② 勾选状态按「企业+主体代码」存本地，同一份报告重开还是勾过的样子；
   ③ 每条挂一个正文锚点，点一下滚过去闪一下，不用自己在两千字里找位置。 */
const CK_RULES = [
  [/^关注.*含数据/, "关注条目混进了数字", "blk-con"],
  [/含数据.+摘要层应为纯定性/, "摘要层混进了数字", "blk-pos"],
  [/找不到直接出处|请复核算式/, "数字在材料里找不到出处", "d-doc"],
  [/data_notes 已声明为推算值/, "推算出来的数字要说清口径", "d-doc"],
  [/期次写法在台账与材料原文中找不到依据/, "期次写法没有依据", "blk-fintable"],
  [/资产总额与负债加权益相差/, "资产负债表不平", "blk-fintable"],
  [/整列写「未披露」/, "写了未披露，材料里其实有", "blk-fintable"],
  [/财务指标表为空|财务表.*为空/, "财务表是空的", "blk-fintable"],
  [/财务表/, "财务表要核", "blk-fintable"],
  [/交代资料来源的表述/, "还有交代来源的句子", "d-doc"],
  [/同一表述在两处出现/, "同一句话出现了两遍", "d-doc"],
  [/不可核实的程度词/, "程度词要换成数据", "d-doc"],
  [/板块段内容偏薄/, "板块段内容偏薄", "blk-segments"],
  [/正面不足/, "正面不足 3 条", "blk-pos"],
  [/关注不足/, "关注不足 3 条", "blk-con"],
  [/总述段缺加粗汇总句/, "总述段缺加粗句", "blk-overview"],
  [/正文偏短/, "正文偏短", "d-doc"],
  [/正文偏长/, "正文偏长", "d-doc"],
];
/* 明细行形如「· 12.34（疑似占比）—— 3、点评：「…」」，按 —— 后面的段名找落点 */
const WHERE_RULES = [
  [/关注/, "blk-con"], [/正面/, "blk-pos"], [/点评|总述/, "blk-overview"],
  [/分部|板块|业务/, "blk-segments"], [/资产/, "blk-asset"],
  [/债务|负债|有息/, "blk-debt"], [/基本/, "blk-basic"],
  [/专题/, "blk-topics"], [/财务|表/, "blk-fintable"],
];
function whereAnchor(w){
  for(const [re, a] of WHERE_RULES) if(re.test(w)) return a;
  return "d-doc";
}
function ckHead(text){
  for(const [re, t, a] of CK_RULES) if(re.test(text)) return { title: t, anchor: a, derived: true };
  const first = (text.split("\n")[0] || "").replace(/[：:]\s*$/, "").trim();
  return { title: first.length > 24 ? first.slice(0, 24) + "…" : first, anchor: "d-doc", derived: false };
}
function ckHash(s){
  let h = 5381;
  for(let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h.toString(36);
}
function ckOwner(){
  const d = S.draft || {};
  return (d.company_full_name || "") + "|" + (d.internal_rating_code || "");
}
function ckAll(){ try{ return JSON.parse(localStorage.getItem("nr_ck_v1") || "{}"); }catch(e){ return {}; } }
function ckDoneSet(){ return new Set(ckAll()[ckOwner()] || []); }
function ckPersist(set){
  const all = ckAll(); all[ckOwner()] = [...set];
  try{ localStorage.setItem("nr_ck_v1", JSON.stringify(all)); }catch(e){}
}
/* 一组内的每一行 = 一个待核对象。
   新版后端给了完整定位（anchor 段、field 输入框、seg 第几个板块、full 整句、si 第几句）；
   旧记录只有一段自然语言，这里把它拆成「数字 / 引文 / 段落」三样，
   再由前端自己按引文在正文里找句——所以旧记录也能定位到句，不是只能到段落。 */
function ckRowsFromItem(it){
  const rows = [];
  for(const d of (it.d || [])){
    const full = d.full || "";
    const head = full ? (full.length > 46 ? full.slice(0, 46) + "…" : full) : (d.where || "");
    const pos = [d.where, d.si ? `第 ${d.si} 句` : ""].filter(Boolean).join(" · ");
    const key = ckHash([it.t, d.num, d.where, full].join("|"));
    rows.push({
      k: key, main: d.num || it.t, pos,
      sub: d.num ? head : "",
      formula: d.formula || "", note: d.note || "",
      anchor: d.anchor || it.a || "d-doc",
      field: d.field || "", seg: d.seg || 0, full,
      num: d.num || "", quote: full
    });
  }
  if(!rows.length){
    // 没有明细的结构性问题（正面不足、财务表为空…）：整组就是一条
    rows.push({ k: ckHash([it.t, it.a].join("|")), main: it.t, pos: "",
      sub: "", formula: "", note: "", anchor: it.a || "d-doc", field: "", seg: 0,
      full: "", num: "", quote: "" });
  }
  return rows;
}
/* 旧记录的一行长这样：
   「0.56%（疑似增速） —— 资产段：「…26年9月末，资产总额13,337.76亿元，增长0.56%。」」 */
function parseLegacyLine(line){
  const t = line.replace(/^[·•]\s*/, "").trim();
  const m = t.match(/^(.*?)(?:（疑似([^）]*)）)?\s*——\s*([^：]+)[：:]\s*「([\s\S]*)」\s*$/);
  if(m){
    const num = (m[1] || "").trim();
    const where = (m[3] || "").trim();
    const quote = (m[4] || "").replace(/^…+/, "").replace(/…+$/, "").trim();
    return { num, kind: (m[2] || "").trim(), where, quote };
  }
  // 「「…」在基本情况与总述段重复」这类没有 —— 分隔的
  const q = t.match(/「([\s\S]*?)」/);
  const w = t.match(/在(.+?)重复/);
  return {
    num: "", kind: "",
    where: w ? w[1].trim() : "",
    quote: q ? (q[1] || "").replace(/^…+/, "").replace(/…+$/, "").trim() : ""
  };
}
/* 段落名 → 输入框键。查不到就空着，交给后面的全文搜 */
const WHERE_FIELD = [
  [/基本/, "basic"], [/总述|点评|概览/, "ov"], [/资产/, "as"], [/债务|负债|有息/, "db"],
  [/分部|板块|业务/, "seg"], [/专题|或有/, "topic"],
];
function fieldForWhere(w){
  for(const [re, f] of WHERE_FIELD) if(re.test(w || "")) return f;
  return "";
}
function fieldForAnchor(a){
  return { "blk-basic": "basic", "blk-overview": "ov", "blk-asset": "as",
    "blk-debt": "db", "blk-segments": "seg", "blk-topics": "topic" }[a] || "";
}
function ckItems(v){
  if((v.issue_items || []).length){
    return v.issue_items.map(it => {
      const rows = ckRowsFromItem(it);
      return { k: ckHash(it.t + "|" + rows.map(r => r.k).join(",")),
        title: it.t, note: it.note || "", anchor: it.a || "d-doc",
        rows, derived: true };
    });
  }
  // 旧版记录：从 issues 文本里拆出「数字 / 引文 / 段落」，句级定位交给前端搜
  const out = [];
  for(const raw of (v.issues || [])){
    const lines = String(raw).split("\n").map(x => x.trim()).filter(Boolean);
    if(!lines.length) continue;
    const head = lines[0];
    const meta = ckHead(head);
    const body = lines.slice(1);
    let rows;
    if(body.length){
      rows = body.map(x => {
        const p = parseLegacyLine(x);
        const field = fieldForWhere(p.where) || fieldForAnchor(meta.anchor);
        const short = p.quote && p.quote.length > 40 ? p.quote.slice(0, 40) + "…" : p.quote;
        return {
          k: ckHash((meta.title || head) + "|" + x),
          main: p.num || (p.where ? ckHead(p.where).title : meta.title),
          pos: [p.where, p.kind].filter(Boolean).join(" · "),
          sub: short || "", formula: "", note: "",
          anchor: whereAnchor(p.where || ""), field, seg: 0,
          full: p.quote || "", num: p.num || "", quote: p.quote || ""
        };
      });
    }else{
      // 只有一行、没有明细的（「同一表述在两处出现…」）：这一行本身就是那条，
      // 标题用类型名，引文放进小字，别把整句话当标题。
      const p = parseLegacyLine(head);
      const field = fieldForWhere(p.where) || fieldForAnchor(meta.anchor);
      const short = p.quote && p.quote.length > 44 ? p.quote.slice(0, 44) + "…" : p.quote;
      rows = [{
        k: ckHash((meta.title || head) + "|" + head),
        main: meta.title, pos: "",
        sub: short || "", formula: "", note: "",
        anchor: meta.anchor, field, seg: 0,
        full: p.quote || "", num: p.num || "", quote: p.quote || ""
      }];
    }
    out.push({ k: ckHash(head), title: meta.title,
      note: meta.derived ? head : "", anchor: meta.anchor, rows, derived: meta.derived });
  }
  return out;
}
function ckHtml(v){
  const items = ckItems(v);
  const auto = (v.auto_checks || []);
  if(!items.length && !auto.length) return "";
  const done = ckDoneSet();
  const allRows = items.reduce((a, x) => a.concat(x.rows), []);
  const n = allRows.filter(r => done.has(r.k)).length;
  const pct = allRows.length ? (n / allRows.length * 100).toFixed(1) : 0;
  let h = `<div class="ck-h"><button class="ck-fold" onclick="ckFold(this)" title="收起核对项">▾</button><b>待核对</b>
      <span class="n"><i id="ckDoneN">${n}</i>/${allRows.length}</span>
      <button class="ck-all" onclick="ckAllDone()" title="把所有待核对都标为已核对">全勾</button>
      <button class="ck-reset" onclick="ckReset()" title="清空勾选">清空</button></div>
    <div class="ck-bar"><i id="ckBar" style="width:${pct}%"></i></div>
    <div class="ck-list">`;
  h += items.map(it => {
    const on = it.rows.filter(r => done.has(r.k)).length;
    const full = on === it.rows.length;
    const part = on > 0 && !full;
    return `<div class="ckg${full ? " done" : ""}" data-k="${it.k}">
      <div class="ckg-h">
        <input type="checkbox"${full ? " checked" : ""} data-part="${part ? 1 : 0}"
          aria-label="整组标为已核对" onchange="ckGroup(this)"/>
        <span class="t">${esc(it.title)}${it.note ? `<i style="font-style:normal;color:#b0b6bf;font-weight:400"> · ${esc(it.note)}</i>` : ""}</span>
        <span class="c">${on}/${it.rows.length}</span>
        <button class="ckg-all" onclick="ckGroupAll(this)" title="这一组全部标为已核对">全勾</button>
      </div>
      <div class="ckg-b">` + it.rows.map(r => {
        const d1 = done.has(r.k);
        const sub = r.sub ? `<span class="s">${esc(r.sub)}</span>` : "";
        const fm = r.formula ? `<span class="f">${esc(r.formula)}</span>` : "";
        const nt = r.note ? `<span class="f">${esc(r.note)}</span>` : "";
        return `<label class="ckr${d1 ? " done" : ""}" data-k="${r.k}" data-t="${r.anchor}"
            data-f="${r.field}" data-g="${r.seg}" data-s="${esc(r.full)}"
            data-n="${esc(r.num || "")}">
          <input type="checkbox"${d1 ? " checked" : ""} onchange="ckOne(this)"/>
          <span class="m" onclick="ckJump(this,event)" title="跳到正文里这一句并选中">
            <span class="k">${esc(r.main)}${r.pos ? `<span class="p">${esc(r.pos)}</span>` : ""}</span>
            ${sub}${fm}${nt}
          </span>
          <span class="go">↗</span>
        </label>`;
      }).join("") + `</div></div>`;
  }).join("") + `</div>`;
  // 机器已经自己核对过的：默认收起，点开能看算式，避免「数字怎么少了」的疑虑
  if(auto.length){
    const lines = auto.join("\n").split("\n").filter(x => x.trim());
    h += `<details class="ck-auto"><summary>机器已自动核对 ${v.auto_count || 0} 项</summary>
      <div class="lst">` + lines.map(x => `<div>${esc(x.replace(/^[·•]\s*/, ""))}</div>`).join("") + `</div></details>`;
  }
  return h;
}
function ckPaint(){
  const rows = [...document.querySelectorAll(".ckr")];
  const done = rows.filter(x => x.classList.contains("done")).length;
  const n = $("#ckDoneN"), bar = $("#ckBar"), rail = $("#railR");
  if(n) n.textContent = done;
  if(bar) bar.style.width = (rows.length ? done / rows.length * 100 : 0) + "%";
  if(rail) rail.classList.toggle("all-done", rows.length > 0 && done === rows.length);
  // 组状态：全勾 / 部分（半选要靠 indeterminate，HTML 属性给不了）
  document.querySelectorAll(".ckg").forEach(g => {
    const rs = [...g.querySelectorAll(".ckr")];
    const on = rs.filter(x => x.classList.contains("done")).length;
    const box = g.querySelector(".ckg-h input");
    if(box){
      box.checked = on === rs.length && rs.length > 0;
      box.indeterminate = on > 0 && on < rs.length;
    }
    g.classList.toggle("done", on === rs.length && rs.length > 0);
    const c = g.querySelector(".c");
    if(c) c.textContent = `${on}/${rs.length}`;
  });
}
function ckOne(input){
  const row = input.closest(".ckr");
  if(!row) return;
  const set = ckDoneSet(), k = row.dataset.k;
  if(input.checked) set.add(k); else set.delete(k);
  ckPersist(set);
  row.classList.toggle("done", input.checked);
  ckPaint();
}
function ckGroup(input){
  const g = input.closest(".ckg");
  if(!g) return;
  const want = input.checked;
  const set = ckDoneSet();
  g.querySelectorAll(".ckr").forEach(r => {
    if(want) set.add(r.dataset.k); else set.delete(r.dataset.k);
    r.classList.toggle("done", want);
    const b = r.querySelector("input");
    if(b) b.checked = want;
  });
  ckPersist(set);
  ckPaint();
}
function ckGroupAll(btn){
  const g = btn.closest(".ckg");
  if(!g) return;
  // 已经全勾的再点一次就取消，省得只能逐条撤
  const rs = [...g.querySelectorAll(".ckr")];
  const want = !rs.every(r => r.classList.contains("done"));
  const set = ckDoneSet();
  rs.forEach(r => {
    if(want) set.add(r.dataset.k); else set.delete(r.dataset.k);
    r.classList.toggle("done", want);
    const b = r.querySelector("input");
    if(b) b.checked = want;
  });
  ckPersist(set);
  ckPaint();
  toast(want ? "这一组已标为核对完成" : "这一组已取消勾选");
}
function ckAllDone(){
  const rows = [...document.querySelectorAll(".ckr")];
  if(!rows.length) return;
  const want = !rows.every(r => r.classList.contains("done"));
  const set = ckDoneSet();
  rows.forEach(r => {
    if(want) set.add(r.dataset.k); else set.delete(r.dataset.k);
    r.classList.toggle("done", want);
    const b = r.querySelector("input");
    if(b) b.checked = want;
  });
  ckPersist(set);
  ckPaint();
  toast(want ? `${rows.length} 项已全部标为核对完成` : "已清空勾选");
}
function ckMore(btn, ev){
  if(ev) ev.stopPropagation();
  const item = btn.closest(".ck");
  const box = item && item.querySelector(".ck-d");
  if(!box) return;
  const show = !box.classList.contains("show");
  box.classList.toggle("show", show);
  btn.textContent = show ? "收起明细" : `看 ${box.children.length} 条明细`;
}
/* 折起/展开核对项。手动开过关过就记住，不再跟着断点走 */
let ckFoldManual = null;
function ckFold(btn){
  const rail = btn.closest(".rail-r");
  if(!rail) return;
  const off = rail.classList.toggle("collapsed");
  ckFoldManual = off;
  btn.textContent = off ? "▸" : "▾";
  btn.title = off ? "展开核对项" : "收起核对项";
}
function ckApplyFold(){
  const rail = $("#railR");
  if(!rail) return;
  const btn = rail.querySelector(".ck-fold");
  if(!btn) return;
  const off = ckFoldManual === null ? PHONE_MQ.matches : ckFoldManual;
  rail.classList.toggle("collapsed", off);
  btn.textContent = off ? "▸" : "▾";
  btn.title = off ? "展开核对项" : "收起核对项";
}
/* 手机上待核对排到工具条下面：正文很长，放在文末等于找不到；
   宽屏回三栏时再挂回网格。挪的是同一个节点，勾过的状态不会丢。 */
function placeRailR(){
  const rail = $("#railR"), bar = document.querySelector(".docbar"), grid = document.querySelector(".docgrid");
  if(!rail || !bar || !grid) return;
  if(PHONE_MQ.matches){
    if(rail.previousElementSibling !== bar) bar.after(rail);
  }else if(rail.parentNode !== grid){
    grid.appendChild(rail);
  }
}
/* ── 跳转：落到「哪一段 → 哪个输入框 → 哪一句」 ───────────────────
   只滚到段落不够用：一段五六百字，眼睛还得自己找那个数。
   这里把目标句子在文本框里选中，浏览器会连着色带光标一起标出来。

   两条路：
   ① 后端给了 field + 整句 → 直接在那一个输入框里选中，最准；
   ② 没给（旧记录、或元数据缺）→ 自己搜：把这些正文框按段落线索排个序，
      逐个切句，按「引文相似度 + 是否含该数字」打分，取最高那句选中。
      所以旧记录也能精确到句，不会退化成「滚到这一大段」。 */
function ckFieldEl(field, seg){
  if(!field) return null;
  if(field === "seg") return document.querySelectorAll("#d-segs .seg-line")[Math.max(0, seg - 1)] || null;
  if(field === "topic") return document.querySelectorAll("#d-topics .topic-body")[Math.max(0, seg - 1)] || null;
  if(field === "table") return document.getElementById("blk-fintable");
  if(field === "ov") return document.querySelector(".ta.ov-body") || document.querySelector(".ta.ov-lead");
  if(field === "as") return document.querySelector(".ta.as-body") || document.querySelector(".ta.as-lead");
  if(field === "db") return document.querySelector(".ta.db-body") || document.querySelector(".ta.db-lead");
  return document.querySelector(".ta." + field);
}
/* 正文里所有「能选中句子」的输入框，按阅读顺序。带 f（field 键）与 name（给人看的段名） */
function ckTextFields(){
  const out = [];
  const push = (el, f, name) => { if(el) out.push({ el, f, name }); };
  push(document.querySelector(".ta.basic"), "basic", "基本情况");
  push(document.querySelector(".ta.ov-body"), "ov", "总述段");
  push(document.querySelector(".ta.as-body"), "as", "资产段");
  push(document.querySelector(".ta.db-body"), "db", "债务段");
  document.querySelectorAll("#d-segs .seg-line").forEach((el, i) => {
    const t = (el.innerText || "").trim();
    const m = t.match(/^\s*\d+\s*[）)．.]?\s*([^，。；：\n]{1,16}?)(?:业务|板块|产品|服务|行业)?方面[，,]/);
    push(el, "seg", `${i + 1}）${m ? m[1] : "板块"}`);
  });
  document.querySelectorAll("#d-topics .topic-body").forEach((el, i) =>
    push(el, "topic", `专题段${i + 1}`));
  return out;
}
/* 按句切开，保留句子本身。与后端 _sentences 同一个规则 */
function splitSents(text){
  const out = [];
  let start = 0;
  const s = text || "";
  for(let i = 0; i < s.length; i++){
    if("。！？".indexOf(s[i]) >= 0){
      const piece = s.slice(start, i + 1);
      if(piece.trim()) out.push({ text: piece, at: start });
      start = i + 1;
    }
  }
  const rest = s.slice(start);
  if(rest.trim()) out.push({ text: rest, at: start });
  return out;
}
/* 比较用：去掉空白与千分位，只比实质字符 */
function normCmp(s){
  return String(s || "").replace(/[\s,，]/g, "");
}
/* 最长公共子串长度：引文常被截断（带 …），只能按重合度认 */
function lcsLen(a, b){
  if(!a || !b) return 0;
  const n = a.length, m = b.length;
  if(n * m > 40000) return 0;              // 太长就不算，别卡页面
  let prev = new Uint16Array(m + 1), cur = new Uint16Array(m + 1), best = 0;
  for(let i = 1; i <= n; i++){
    for(let j = 1; j <= m; j++){
      cur[j] = a[i - 1] === b[j - 1] ? prev[j - 1] + 1 : 0;
      if(cur[j] > best) best = cur[j];
    }
    const t = prev; prev = cur; cur = t;
    cur.fill(0);
  }
  return best;
}
/* 数字要在「词边界」上匹配：'92 字' 不能因为正文里有 692.74 就算命中。
   正文与目标都先归一化（去逗号、去空白），再要求前后不是数字或小数点。 */
function numHit(text, num){
  const n = normCmp(num);
  if(!n) return false;
  const esc = n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  try{
    return new RegExp("(^|[^0-9.])" + esc + "([^0-9.]|$)").test(normCmp(text));
  }catch(e){
    return normCmp(text).indexOf(n) >= 0;
  }
}
function scoreSent(sent, quote, num){
  const s = normCmp(sent), q = normCmp(quote);
  let sc = 0;
  if(num){
    if(numHit(sent, num)) sc += 4;                       // 这个数字就在这句里
  }
  if(q){
    if(q && s.indexOf(q) >= 0) sc += 10;                 // 引文完整落在这句
    else sc += Math.min(lcsLen(s, q), 24) / 3;           // 被截断过，按重合长度
  }
  return sc;
}
/* 在候选输入框里找「那句话」，返回 { el, name, si, at, text } */
function findSentence(field, seg, full, num, label){
  const quote = (full || "").replace(/^…+/, "").replace(/…+$/, "").trim();
  // 「×× 字」这种不是数字，是篇幅统计，别拿去搜正文
  const needle = /^\s*\d+\s*字\s*$/.test(num || "") ? "" : num;
  if(!quote && !needle && !label) return null;
  const list = ckTextFields();
  if(!list.length) return null;
  // 段落线索优先：先只在这个框里找，找不到（或分太低）才全篇搜
  const hint = ckFieldEl(field, seg);
  if(hint){
    const own = list.find(x => x.el === hint);
    const order = own ? [own].concat(list.filter(x => x.el !== hint)) : list;
    const hit = bestIn(order, quote, needle, label);
    if(hit && hit.score >= 4) return hit;
  }
  return bestIn(list, quote, needle, label);
}
function bestIn(list, quote, num, label){
  let best = null;
  const lab = normCmp(label).replace(/^\d+[）)]/, "");
  for(const f of list){
    const text = f.el.tagName === "TEXTAREA" ? (f.el.value || "") : (f.el.innerText || "");
    if(!text) continue;
    // 段落名对得上才加分：「其他业务（92 字）」这种没有数字也没有引文，
    // 只能靠段名认。不能给无条件兜底分——那会让第一句永远胜出。
    const nameHit = lab.length >= 2 &&
      normCmp(f.name).replace(/^\d+[）)]/, "").indexOf(lab) >= 0;
    const sents = splitSents(text);
    for(let i = 0; i < sents.length; i++){
      let sc = scoreSent(sents[i].text, quote, num);
      if(nameHit) sc += 3;
      if(sc <= 0) continue;
      if(!best || sc > best.score){
        best = { el: f.el, field: f.f, name: f.name, si: i + 1, at: sents[i].at,
          text: sents[i].text, fullText: text, score: sc };
      }
    }
  }
  return best;
}
/* 句子太长（两百字一句的不少）时，把高亮收窄到「含这个数的那一小句」。
   整句选中看着还是一大块，收窄到分句才一眼看到数字。
   但两种情形必须保留整句：①目标就是整句（重复句、点题句，引文等于整句）；
   ②句子本来就不长。否则会把「这一句」切成残缺的半截。 */
function narrowHighlight(hit, num, quote){
  const text = hit.fullText || "";
  const at = hit.at;
  const sent = hit.text || "";
  const LIMIT = 64;
  if(!text || sent.length <= LIMIT) return [at, at + sent.length];
  const q = normCmp(quote), sn = normCmp(sent);
  const parts = [];
  let st = 0;
  for(let i = 0; i < sent.length; i++){
    if("，；,;".indexOf(sent[i]) >= 0){
      parts.push({ t: sent.slice(st, i + 1), at: st });
      st = i + 1;
    }
  }
  if(st < sent.length) parts.push({ t: sent.slice(st), at: st });
  // ① 有具体数字：先切到含它的那一小句——长句里这才是「定位」
  const n = normCmp(num);
  let ci = -1;
  if(n && !/^\s*\d+\s*字\s*$/.test(num || "") && parts.length > 1){
    ci = parts.findIndex(p => numHit(p.t, num));
  }
  if(ci < 0){
    // ② 目标就是整句（重复句、点题句：引文等于整句），不要切
    if(q && (q === sn || q.length >= sn.length - 2)) return [at, at + sent.length];
    if(parts.length < 2) return [at, at + sent.length];
    if(q){
      let best = -1, bestSc = 0;
      parts.forEach((p, i) => {
        const sc = lcsLen(normCmp(p.t), q);
        if(sc > bestSc){ bestSc = sc; best = i; }
      });
      ci = best;
    }
  }
  if(ci < 0) return [at, at + sent.length];
  let lo = ci, hi = ci;
  const span = () => parts.slice(lo, hi + 1).reduce((a, p) => a + p.t.length, 0);
  while(span() < 26 && (lo > 0 || hi < parts.length - 1)){
    if(hi < parts.length - 1) hi++;
    else lo--;
  }
  return [at + parts[lo].at, at + parts[hi].at + parts[hi].t.length];
}
/* 在 textarea 或 contenteditable 里选中一段，返回是否选中 */
function selectRange(el, start, end){
  if(!el) return false;
  if(el.tagName === "TEXTAREA"){
    el.focus({ preventScroll: true });
    try{ el.setSelectionRange(start, end); }catch(e){ return false; }
    return true;
  }
  let pos = 0, startNode = null, startOff = 0, endNode = null, endOff = 0;
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  let node;
  while((node = walker.nextNode())){
    const len = node.textContent.length;
    if(startNode === null && pos + len > start){ startNode = node; startOff = start - pos; }
    if(startNode !== null && pos + len >= end){ endNode = node; endOff = end - pos; break; }
    pos += len;
  }
  if(!startNode || !endNode) return false;
  const range = document.createRange();
  range.setStart(startNode, startOff);
  range.setEnd(endNode, endOff);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  el.focus({ preventScroll: true });
  return true;
}
/* 按「整句原文」选中（新版记录带 full 时走这条，最准） */
function selectSentence(el, full){
  if(!el || !full) return false;
  const text = el.tagName === "TEXTAREA" ? (el.value || "") : (el.innerText || "");
  let i = text.indexOf(full);
  if(i < 0 && full.length > 12) i = text.indexOf(full.slice(0, 12));
  if(i < 0) return false;
  return selectRange(el, i, Math.min(text.length, i + full.length));
}
function ckJump(el, ev){
  if(ev){ ev.stopPropagation(); ev.preventDefault(); }
  const row = el.closest && el.closest(".ckr");
  const anchor = row ? row.dataset.t : (el.dataset && el.dataset.t);
  const field = row ? (row.dataset.f || "") : "";
  const seg = row ? Number(row.dataset.g || 0) : 0;
  const full = row ? (row.dataset.s || "") : "";
  const num = row ? (row.dataset.n || "") : "";
  const label = (() => {
    const p = row ? row.querySelector(".p") : null;
    const t = p ? p.textContent.trim() : "";
    return t.split("·")[0].trim();
  })();
  const target = document.getElementById(anchor || "d-doc");
  if(!target) return;
  flashEl(target);
  // 表格类问题没有「句子」可选，滚到表就行
  if(field === "table"){ target.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  const hint = ckFieldEl(field, seg);
  (hint || target).scrollIntoView({ behavior: "smooth", block: "center" });
  // 等滚动落位再选，否则浏览器会把选区滚回它自己原来的位置
  clearTimeout(ckJump._t);
  ckJump._t = setTimeout(() => {
    const hit = findSentence(field, seg, full, num, label);
    if(!hit){
      // 没搜到具体句子（如「内容偏薄」这类只指段不指句的）：
      // 至少落在那个输入框上并选中它的第一句，同时清掉上一次的残留选区——
      // 不清的话，用户看到的还是上一处的高亮，会以为定错了地方。
      const own = ckFieldEl(field, seg);
      const sel = window.getSelection();
      if(own && (field === "seg" || field === "topic")){
        const t = own.tagName === "TEXTAREA" ? (own.value || "") : (own.innerText || "");
        const s0 = splitSents(t)[0];
        if(s0 && selectRange(own, s0.at, s0.at + s0.text.length)){
          own.scrollIntoView({ behavior: "smooth", block: "center" });
          flashEl(own.closest(".blk") || own);
          toast("已定位到这一段（这段没有可指的单句）");
          return;
        }
      }
      if(sel) sel.removeAllRanges();
      return;
    }
    const [s, e] = narrowHighlight(hit, num, full);
    if(!selectRange(hit.el, s, e)) return;
    // 选中的片段若在视口外（长段、手机上），把它带进来
    const box = hit.el.getBoundingClientRect();
    if(box.top < 70 || box.bottom > innerHeight - 40){
      hit.el.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    flashEl(hit.el.closest(".blk") || hit.el);
    toast(`已定位：${hit.name} 第 ${hit.si} 句`);
  }, 300);
}
