/* 候选观点：正文倒抽出来的判断句，点一条就加进上面的列表，加过的不再出现。
   定了稿但没被选中过的条目（模型给回池里的）也可以再挑回来。 */
function renderPool(kind, pool){
  const box = $("#" + (kind === "pos" ? "p-pos" : "p-con"));
  if(!box) return;
  const cur = [...document.querySelectorAll(kind === "pos" ? ".it-pos" : ".it-con")].map(t => t.value.trim());
  const rest = (pool || []).filter(t => t && !cur.includes(t));
  if(!rest.length){ box.innerHTML = ""; syncRails(); return; }
  // 在左栏时有的是竖着的地方，整句铺出来；在板块里就压成一行，免得把正文顶下去
  const inRail = !!(box.closest && box.closest("#railL"));
  const cut = inRail ? 999 : 42;
  box.innerHTML = `<div class="pool-t">${kind === "pos" ? "正面" : "关注"} · 候选 ${rest.length} 条，点一条加进去</div>` +
    rest.map((t, i) => `<button class="chip" title="${esc(t)}" onclick="usePool('${kind}',${i})">${esc(t.slice(0, cut))}${t.length > cut ? "…" : ""}</button>`).join("");
  syncRails();
  box.dataset.pool = JSON.stringify(rest);
}

function usePool(kind, i){
  const box = $("#" + (kind === "pos" ? "p-pos" : "p-con"));
  const rest = JSON.parse(box.dataset.pool || "[]");
  const text = rest[i];
  if(!text) return;
  addItem(kind, text);                       // 加进列表
  rest.splice(i, 1);                         // 从候选里拿掉
  renderPool(kind, rest);
  renumber();
  // 左栏和正文隔着一条街：加进去的条目在视野外就滚过去闪一下，
  // 否则点了没反应，会以为没加上

  const r = last.getBoundingClientRect();

  const blk = last.closest(".blk");

    blk.classList.add("flash");
    clearTimeout(blk._fl);

/* 条目 markup：序号兼作拖动把手，删除做成右上角一个圈 */

/* 删除：先淡出再摘掉，同时留一个「撤销」。

function renumber(){

}

/* ── 拖动排序 ──────────────────────────────────────────────────
   按住前面的序号（1）2）…）就能拖，松手落位；拖的是整条，文字不会丢。
   用 pointer 事件而不是 HTML5 拖放：后者在触屏上不触发，而这份报告手机上也要改。
   拖动期间原位留一个虚线占位、其余条目跟着让位，落点看得见；
   中途按 Esc 或指针被系统收走，就退回原来的位置。 */
const DRAG = { on: false, started: false, el: null, list: null, ph: null, ghost: null,
  sp: null, x0: 0, y0: 0, lastY: 0, offX: 0, offY: 0, w: 0, h: 0,
  anchor: null, raf: 0, v: 0 };

function dragBegin(e){
  if(e.button) return;                       // 只认左键/单指
  const num = e.target.closest && e.target.closest(".item>.num");
  if(!num) return;
  const el = num.closest(".item");
  if(!el || el.classList.contains("ph")) return;
  const r = el.getBoundingClientRect();
  Object.assign(DRAG, {
    on: true, started: false, cancel: false, el, list: el.parentNode, ph: null, ghost: null, sp: null,
    x0: e.clientX, y0: e.clientY, lastY: e.clientY,
    offX: e.clientX - r.left, offY: e.clientY - r.top, w: r.width, h: r.height,
    anchor: el.nextElementSibling, v: 0
  });
  try{ num.setPointerCapture(e.pointerId); }catch(err){}
  document.addEventListener("pointermove", dragMove, { passive: false });
  document.addEventListener("pointerup", dragEnd);
  document.addEventListener("pointercancel", dragEnd);
  document.addEventListener("keydown", dragKey);
}

function dragLift(){
  const d = DRAG;
  d.started = true;
  document.body.classList.add("dragging");
  // 占位：高度与原条目一致，位置就是它现在的位置
  const ph = document.createElement("div");
  ph.className = "item ph";
  ph.style.height = d.h + "px";
  d.list.insertBefore(ph, d.el);
  d.ph = ph;
  // 影子：克隆一份浮起来跟着指针，宽度锁定，避免拖到空格里忽然变形
  const g = d.el.cloneNode(true);
  g.className = "item item-ghost";
  g.style.width = d.w + "px";
  g.style.height = d.h + "px";
  // textarea 的当前内容是 value，不在子节点里：克隆之后要把值补过去，
  // 否则刚改过的那句在影子里还是旧文字。
  const src = d.el.querySelectorAll("textarea"), dst = g.querySelectorAll("textarea");
  src.forEach((t, i) => { if(dst[i]) dst[i].value = t.value; });
  g.style.transform = `translate(${d.x0 - d.offX}px,${d.y0 - d.offY}px)`;
  document.body.appendChild(g);
  d.ghost = g;
  d.el.classList.add("drag-src");
}

function dragPlace(y){
  const d = DRAG;
  if(!d.ph) return;
  let before = null;
  for(const k of d.list.children){
    if(!k.classList.contains("item") || k === d.ph || k === d.el) continue;
    const r = k.getBoundingClientRect();
    if(y < r.top + r.height / 2){ before = k; break; }
  }
  if(before){ if(d.ph.nextElementSibling !== before) d.list.insertBefore(d.ph, before); }
  else if(d.list.lastElementChild !== d.ph) d.list.appendChild(d.ph);
}

function dragMove(e){
  const d = DRAG;
  if(!d.on) return;
  if(!d.started){
    if(Math.abs(e.clientY - d.y0) < 4 && Math.abs(e.clientX - d.x0) < 4) return;
    dragLift();
  }
  if(e.cancelable) e.preventDefault();
  d.lastY = e.clientY;
  if(d.ghost) d.ghost.style.transform = `translate(${e.clientX - d.offX}px,${e.clientY - d.offY}px)`;
  dragPlace(e.clientY);
  dragScroll(e.clientY);
}

/* 拖到视口上下沿附近就自己滚，长列表不用先滚到位置再拖 */
function dragScroll(y){
  const d = DRAG;
  if(!d.sp) d.sp = scrollHost(d.list);
  const isDoc = d.sp === document.scrollingElement;
  const top = isDoc ? 0 : d.sp.getBoundingClientRect().top;
  const bottom = isDoc ? innerHeight : d.sp.getBoundingClientRect().bottom;
  const edge = 54;
  let v = 0;
  if(y < top + edge) v = -(top + edge - y) / 4;
  else if(y > bottom - edge) v = (y - (bottom - edge)) / 4;
  d.v = Math.max(-15, Math.min(15, Math.round(v)));
  if(d.v && !d.raf) d.raf = requestAnimationFrame(dragScrollStep);
  if(!d.v && d.raf){ cancelAnimationFrame(d.raf); d.raf = 0; }
}
function dragScrollStep(){
  const d = DRAG;
  d.raf = 0;
  if(!d.started || !d.v) return;
  d.sp.scrollTop += d.v;
  dragPlace(d.lastY);
  d.raf = requestAnimationFrame(dragScrollStep);
}
function scrollHost(el){
  let p = el && el.parentNode;
  while(p && p !== document.body && p.nodeType === 1){
    const s = getComputedStyle(p);
    if(/(auto|scroll)/.test(s.overflowY) && p.scrollHeight > p.clientHeight + 4) return p;
    p = p.parentNode;
  }
  return document.scrollingElement || document.documentElement;
}

function dragEnd(ev){
  const d = DRAG;
  document.removeEventListener("pointermove", dragMove);
  document.removeEventListener("pointerup", dragEnd);
  document.removeEventListener("pointercancel", dragEnd);
  document.removeEventListener("keydown", dragKey);
  if(d.raf){ cancelAnimationFrame(d.raf); d.raf = 0; }
  d.v = 0;
  if(d.on && d.started && d.el){
    if(d.cancel){
      // 撤：先把占位拿掉，再把原条目插回它原来的后面那一条前面。
      // 顺序不能反——占位还在时插回去，replaceChild 又会把它挪到占位的落点。
      if(d.ph && d.ph.parentNode) d.ph.remove();
      if(d.anchor && d.anchor.parentNode === d.list) d.list.insertBefore(d.el, d.anchor);
      else if(d.list) d.list.appendChild(d.el);
    }else if(d.ph && d.ph.parentNode){
      d.ph.parentNode.replaceChild(d.el, d.ph);
    }
    d.el.classList.remove("drag-src");
    if(d.ghost) d.ghost.remove();
    document.body.classList.remove("dragging");
    renumber();
    if(!d.cancel){
      d.el.classList.remove("settle");
      void d.el.offsetWidth;
      d.el.classList.add("settle");
      const el = d.el;
      setTimeout(() => el.classList.remove("settle"), 900);
    }
  }else{
    if(d.el) d.el.classList.remove("drag-src");
    if(d.ghost) d.ghost.remove();
    document.body.classList.remove("dragging");
  }
  Object.assign(d, { on: false, started: false, cancel: false, el: null, list: null, ph: null,
    ghost: null, sp: null, anchor: null });
}

/* Esc 撤掉这次拖动，回到原位 */
function dragKey(e){
  const d = DRAG;
  if(e.key !== "Escape" || !d.on) return;
  d.cancel = true;
  dragEnd(e);
}
function flashBlk(el){
  const blk = el && el.closest && el.closest(".blk");
  if(!blk) return;
  blk.classList.remove("flash");
  void blk.offsetWidth;
  blk.classList.add("flash");
  clearTimeout(blk._fl);
  blk._fl = setTimeout(() => blk.classList.remove("flash"), 1500);
}
document.addEventListener("pointerdown", dragBegin);

/* 分部段：编号、板块名、正文在同一段里，像 Word 那样整段编辑 */
function segText(name, body){
  const n = (name || "").trim();
  return (n ? n + segSuffix(n) : "") + (body || "").trim();
}
function parseSeg(raw, lastName){
  const t = (raw || "").replace(/\u00a0/g, " ").trim();
  const m = t.match(/^\s*\d+\s*[）)．.]?\s*([\s\S]*)$/);
  let rest = m ? m[1] : t;
  const d = rest.match(/^([^，。；：\n]{1,24}?)((?:业务|板块|产品|服务|行业)?方面[，,、：:])\s*/);
  if(d) return { name: d[1].trim(), body: rest.slice(d[0].length).trim() };
  return { name: (lastName || "").trim(), body: rest.trim() };
}
function renderSegs(segs){
  $("#d-segs").innerHTML = segs.map(s => `<div class="seg">
    <div class="seg-line" contenteditable="plaintext-only" spellcheck="false"
      data-name="${esc(s.name)}"></div>
    <button class="tool" onclick="this.closest('.seg').remove();renumberSegs()">×</button>
  </div>`).join("");
  [...document.querySelectorAll("#d-segs .seg")].forEach((el, i) => {
    const s = segs[i] || {};
    el.querySelector(".seg-line").textContent = `${i + 1}）${segText(s.name, s.body)}`;
  });
}
function addSeg(){
  const div = document.createElement("div");
  div.className = "seg";
  div.innerHTML = `<div class="seg-line" contenteditable="plaintext-only" spellcheck="false"
    data-name=""></div>
    <button class="tool" onclick="this.closest('.seg').remove();renumberSegs()">×</button>`;
  $("#d-segs").appendChild(div);
  renumberSegs();
  const line = div.querySelector(".seg-line");
  line.focus();
}
function renumberSegs(){
  [...document.querySelectorAll("#d-segs .seg")].forEach((el, i) => {
    const line = el.querySelector(".seg-line");
    if(document.activeElement === line) return;   // 正在编辑的不动，免得光标跳走
    const t = (line.textContent || "").replace(/^\s*\d+\s*[）)．.]?\s*/, "");
    line.textContent = `${i + 1}）${t}`;
  });
}

function renderTopics(ts){
  $("#d-topics").innerHTML = ts.map(t => `<div class="topic">
    <textarea class="ta topic-lead lead" rows="1" placeholder="加粗总起句：先给判断">${esc(t.lead)}</textarea>
    <textarea class="ta topic-body" rows="1" placeholder="正文">${esc(t.body)}</textarea>
    <button class="tool" onclick="this.parentNode.remove()">× 删除本段</button>
  </div>`).join("");
}
function addTopic(lead, body){
  const div = document.createElement("div");
  div.className = "topic";
  div.innerHTML = `<textarea class="ta topic-lead lead" rows="1" placeholder="加粗总起句：先给判断">${esc(lead || "")}</textarea>
    <textarea class="ta topic-body" rows="1" placeholder="正文">${esc(body || "")}</textarea>
    <button class="tool" onclick="this.parentNode.remove()">× 删除本段</button>`;
  $("#d-topics").appendChild(div);
  const boxes = div.querySelectorAll("textarea");
  boxes.forEach(autoGrow);
  (body ? boxes[1] : boxes[0]).focus();
}

function collectDraft(){
  const d = JSON.parse(JSON.stringify(S.draft));
  d.company_full_name = $("#d-company").value.trim();
  d.internal_rating_code = $("#d-code").value.trim();
  d.positive = [...document.querySelectorAll(".it-pos")].map(t => t.value.trim()).filter(Boolean);
  d.concern = [...document.querySelectorAll(".it-con")].map(t => t.value.trim()).filter(Boolean);
  d.basic_info = $(".ta.basic").value.trim();
  d.commentary.overview = { lead: $(".ta.ov-lead").value.trim(), body: $(".ta.ov-body").value.trim() };
  d.commentary.segments = [...document.querySelectorAll("#d-segs .seg")].map(s => {
    const line = s.querySelector(".seg-line");
    return parseSeg(line.innerText || line.textContent || "", line.dataset.name);
  }).filter(s => s.body);
  d.commentary.asset = { lead: $(".ta.as-lead").value.trim(), body: $(".ta.as-body").value.trim() };
  d.commentary.debt = { lead: $(".ta.db-lead").value.trim(), body: $(".ta.db-body").value.trim() };
  d.commentary.special_topics = [...document.querySelectorAll("#d-topics .topic")].map(t => ({
    lead: t.querySelector(".topic-lead").value.trim(),
    body: t.querySelector(".topic-body").value.trim()
  })).filter(t => t.body);
  return d;
}

async function exportDocx(){
  try{
    const d = collectDraft();
    if(!d.company_full_name) return toast("请填企业全称", true);
    const btns = [...document.querySelectorAll("[data-export]")];
    btns.forEach(b => b.disabled = true);
    setStep("export", { state: "run", pct: 60, detail: "排版中" });
    const r = await api("/api/export", { draft: d, company: S.company });
    setStep("export", { state: "done", pct: 100, detail: r.name });
    const a = document.createElement("a");
    a.href = dlUrl(r.url);
    a.download = r.name;
    a.click();
    toast("已导出 " + r.name + (r.cleaned ? `（导出前清理 ${r.cleaned} 处重复或来源表述）` : ""));
    refreshUsage();
    btns.forEach(b => b.disabled = false);
    if(HIST.open) loadHistory();  // 记录里的「已导出」状态跟着更新
    if(PKG.open) loadBundle();  // 清单里补上刚落盘的这份

    setStep("export", { state: "error", detail: e.message });
    toast(e.message, true);
    document.querySelectorAll("[data-export]").forEach(b => b.disabled = false);
  }
}

function _val(id){ const el = $("#"+id); return el ? el.value.trim() : ""; }

async function saveSettings(section){
  const msgId = { llm: "msgLlm", mail: "msgMail", caihui: "msgCh", password: "msgPw" }[section];
  const msg = msgId ? $("#"+msgId) : null;
  const say = (t, kind) => { if(msg){ msg.className = "msg" + (kind ? " " + kind : ""); msg.textContent = t; } };
  const body = { section };
  if(section === "llm"){ body.url = _val("stLlmUrl"); body.model = _val("stLlmModel"); body.apiKey = _val("stLlmKey"); }
  if(section === "caihui"){ body.url = _val("stChUrl"); body.key = _val("stChKey"); }
  if(section === "mail"){ body.host = _val("stMailHost"); body.port = _val("stMailPort");
    body.tls = _val("stMailTls"); body.user = _val("stMailUser"); body.password = _val("stMailPass"); }
  if(section === "password"){ body.old = _val("stPwOld"); body.new = _val("stPwNew"); }
  say("保存中…");
  try{
    const r = await api("/api/settings", body);
    if(section === "password" && r.token){
      TOKEN = r.token;
      localStorage.setItem("nrToken", TOKEN);
    }
    SET.data = r.settings || SET.data;
    renderSettings();
    const m2 = $("#" + msgId);
    if(m2){ m2.className = "msg ok"; m2.textContent = section === "password" ? "已改口令，旧登录已失效" : "已保存"; }
    if(section === "llm" || section === "mail"){
      loadModels();
      MAIL.cfg = null;
      if(MAIL.open) loadMailPanel();
    }
    toast("设置已保存");
  }catch(e){
    say(e.message || "保存失败", "err");
  }
}

  let h = `<div class="vh"><b>版本历史</b>

    subject: ($("#mlSubject").value || "").trim(),
    body: $("#mlBody") ? $("#mlBody").value : "",
    with_materials: !!($("#mlPdf") && $("#mlPdf").checked),
    materials: ((PKG.data && PKG.data.materials) || []).map(x => x.name),
    history_id: (S.draft && S.draft.history_id) || "",
  };
  if(!payload.to) return toast("请填收件人", true);
  if(!payload.subject) return toast("请填邮件标题", true);
  go.disabled = true;
  const old = go.textContent;
  go.textContent = "发送中…";
  st.className = "st";
  st.textContent = "正在连接邮件服务器…";
  try{
    if(!cfg.ready) throw new Error("还没配发件邮箱：点「设置」填 SMTP 服务器与授权码");
    // 没导出过就现场排版：把草稿带上，服务端会先出 docx 再发
    if(!MAIL.docx && !((PKG.data && PKG.data.docx) || []).length && S.draft){
      payload.draft = collectDraft();
    }else{
      payload.docx = MAIL.docx || (((PKG.data && PKG.data.docx) || [])[0] || {}).name || "";
    }
    const r = await api("/api/mail", payload);
    st.textContent = `已发送 · ${r.attachments.length} 个附件 · ${fmtSize(r.size)}`;
    toast(`已发送给 ${r.to.join("、")}`);
    MAIL.to = payload.to; MAIL.subject = payload.subject; MAIL.body = payload.body;
    refreshUsage();
    setTimeout(() => { if(MAIL.open) closeMail(); }, 1200);
  }catch(err){
    st.className = "st err";
    st.textContent = err.message;
  }finally{
    go.disabled = false;
    go.textContent = old;
  }
}

document.addEventListener("click", e => {
  const m = $("#topicMenu");
  if(m && m.classList.contains("show") && !e.target.closest(".tp-add")) m.classList.remove("show");
  if(!MAIL.open) return;
  if(e.target.closest("#mailPanel") || e.target.closest("#btnMail")) return;
  closeMail();
});

/* ---------------- 打包下载 ---------------- */
const PKG = { open: false, data: null, sel: {}, busy: false, loading: false };

function pkgCompany(){
  const el = $("#d-company");
  return (el ? el.value.trim() : "") || S.company || $("#company").value.trim();
}

async function toggleBundle(e){
  if(e) e.stopPropagation();
  if(PKG.open){ closeBundle(); return; }
  PKG.open = true;
  await loadBundle();
}

async function fetchFileList(force){
  // 报告与底稿清单：打包和发邮件都要用，取一次存 PKG.data
  if(PKG.data && !force) return PKG.data;
  const q = new URLSearchParams();
  q.set("company", pkgCompany());
  (S.loaded || []).forEach(t => q.append("title", t));
  const r = await (await fetch(apiUrl("/api/bundle?" + q.toString()))).json();
  if(r.error) throw new Error(r.error);
  PKG.data = r;
  return r;
}

async function loadBundle(){
  PKG.sel = {};
  $("#pkgPanel").classList.add("show");
  $("#pkgPanel").innerHTML = `<div class="pk-h">打包下载<span class="x" onclick="closeBundle()">×</span></div>
    <div class="pk-sub">正在读取文件清单…</div>`;
  try{
    const r = await fetchFileList(true);
    (r.docx || []).forEach((x, i) => { if(i === 0) PKG.sel["docx:" + x.name] = true; });
    (r.materials || []).forEach(x => { PKG.sel["pdf:" + x.name] = true; });
    renderBundle();
  }catch(err){
    $("#pkgPanel").innerHTML = `<div class="pk-h">打包下载<span class="x" onclick="closeBundle()">×</span></div>
      <div class="pk-sub">${esc(err.message)}</div>`;
  }
}

function closeBundle(){
  PKG.open = false;
  $("#pkgPanel").classList.remove("show");
}

function pkgRow(key, name, meta){
  return `<label class="pkrow">
    <input type="checkbox" data-key="${esc(key)}" ${PKG.sel[key] ? "checked" : ""} onchange="pkgToggle(this)"/>
    <span><span class="nm">${esc(name)}</span>${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</span>
  </label>`;
}

function renderBundle(){
  const d = PKG.data || {};
  const docs = d.docx || [], mats = d.materials || [];
  let b = "";

  b += `<div class="pkgrp"><span>报告</span></div>`;
  if(docs.length){
    docs.forEach(x => { b += pkgRow("docx:" + x.name, x.name, `${fmtSize(x.size)} · ${x.mtime}`); });
  }else if(S.draft){
    PKG.sel["docx:@new"] = PKG.sel["docx:@new"] !== false;
    b += pkgRow("docx:@new", "报告 Word（按当前内容现场排版）", "尚未导出，打包时自动生成");
  }else{
    b += `<div class="pkrow none">还没有报告，先生成草稿</div>`;
  }

  const pdfOn = mats.every(x => PKG.sel["pdf:" + x.name]);
  b += `<div class="pkgrp"><span>原底稿（${mats.length} 份）</span>${mats.length > 1
    ? `<button onclick="pkgAll('pdf:', ${!pdfOn})">${pdfOn ? "取消全选" : "全选"}</button>` : ""}</div>`;
  if(mats.length){
    mats.forEach(x => {
      const meta = [x.pages ? x.pages + " 页" : "", fmtSize(x.size),
                    x.source === "upload" ? "本地上传" : "财汇下载"].filter(Boolean).join(" · ");
      b += pkgRow("pdf:" + x.name, x.title || x.name, meta);
    });
  }else{
    b += `<div class="pkrow none">本次没有读取过 PDF</div>`;
  }

  b += `<div class="pkgrp"><span>附加</span></div>`;
  PKG.sel["json:1"] = !!PKG.sel["json:1"];
  b += pkgRow("json:1", "草稿数据.json", "正文与表格的结构化数据，便于下次接着改");

  $("#pkgPanel").innerHTML = `<div class="pk-h">打包下载<span class="x" onclick="closeBundle()">×</span></div>
    <div class="pk-sub">勾选要放进压缩包的文件</div>
    <div class="pk-body">${b}</div>
    <div class="pk-foot"><span class="sum" id="pkSum"></span>
      <button class="btn-sm solid" id="pkGo" onclick="runBundle()">打包下载</button></div>`;
  bundleSum();
}

function pkgAll(prefix, on){
  Object.keys(PKG.sel).forEach(k => { if(k.indexOf(prefix) === 0) PKG.sel[k] = on; });
  renderBundle();
}

function pkgToggle(el){
  PKG.sel[el.dataset.key] = el.checked;
  bundleSum();
}

function bundleSum(){
  const d = PKG.data || {};
  const keys = Object.keys(PKG.sel).filter(k => PKG.sel[k]);
  let bytes = 0;
  keys.forEach(k => {
    const [kind, name] = [k.slice(0, k.indexOf(":")), k.slice(k.indexOf(":") + 1)];
    const pool = kind === "docx" ? (d.docx || []) : kind === "pdf" ? (d.materials || []) : [];
    const hit = pool.find(x => x.name === name);
    if(hit) bytes += hit.size || 0;
  });
  const sum = $("#pkSum");
  if(!sum) return;
  sum.textContent = keys.length
    ? `已选 ${keys.length} 项${bytes ? " · " + fmtSize(bytes) : ""}`
    : "未选择文件";
  const go = $("#pkGo");
  if(go) go.disabled = !keys.length || PKG.busy;
}

async function runBundle(){
  const keys = Object.keys(PKG.sel).filter(k => PKG.sel[k]);
  if(!keys.length) return toast("请勾选要打包的文件", true);
  const docxKey = keys.find(k => k.indexOf("docx:") === 0) || "";
  const docxName = docxKey && docxKey !== "docx:@new" ? docxKey.slice(5) : "";
  const body = {
    company: pkgCompany(),
    docx: docxName,
    materials: keys.filter(k => k.indexOf("pdf:") === 0).map(k => k.slice(4)),
    with_json: keys.indexOf("json:1") >= 0
  };
  if(!docxName && S.draft) body.draft = collectDraft();

  PKG.busy = true;
  const go = $("#pkGo");
  if(go){ go.disabled = true; go.textContent = "打包中…"; }
  try{
    const r = await api("/api/bundle", body);
    const a = document.createElement("a");
    a.href = dlUrl(r.url);
    a.download = r.name;
    a.click();
    closeBundle();
    toast(`已打包 ${r.files.length} 个文件 · ${fmtSize(r.size)}`);
  }catch(e){
    toast(e.message, true);
    PKG.busy = false;
    if(go){ go.disabled = false; go.textContent = "打包下载"; }
    bundleSum();
  }
}

document.addEventListener("click", e => {
  if(!PKG.open) return;
  if(e.target.closest("#pkgPanel") || e.target.closest("#btnPkg")) return;
  closeBundle();
});

// 口令校验通过后才去拉数据：没进来之前不发任何要 token 的请求
let booted = false;
function bootData(){
  if(booted) return;
  booted = true;
  loadModels();
  pingConn();
  refreshUsage();
  syncButtons();  // 初始状态：无材料时两个动作都灰着
}
gateBoot();
$("#company").addEventListener("keydown", e => { if(e.key === "Enter") doSearch(); });
</script>
